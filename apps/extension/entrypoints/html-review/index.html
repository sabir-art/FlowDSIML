<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vérifier avant l’envoi</title>
  </head>
  <body>
    <header class="top">
      <picture>
        <source srcset="/logo-tutoclick-compact-sombre.svg" media="(prefers-color-scheme: dark)" />
        <img src="/logo-tutoclick-compact.svg" height="28" alt="TutoClick" />
      </picture>
      <span class="t" id="top-title" aria-hidden="true"></span>
    </header>
    <main id="main" class="vw" tabindex="-1">
      <div id="srv" class="srv" role="status" hidden></div>
      <div id="alert" class="alert" role="alert" hidden></div>
      <div>
        <h1 id="h1"></h1>
        <p class="mu intro" id="intro"></p>
      </div>
      <div class="vhead" id="vhead">
        <div class="fld2" id="name-field">
          <label class="fl2" for="vt" id="vt-label"></label>
          <input class="inp" id="vt" type="text" maxlength="160" autocomplete="off" />
          <p class="ferr" id="vt-err" hidden></p>
        </div>
        <div class="fld2">
          <span class="fl2" id="vk"></span>
          <div class="fd-segmented" id="kind" role="radiogroup" aria-labelledby="vk"></div>
          <p class="kline" id="kline" hidden></p>
        </div>
      </div>
      <dl class="sumbar" id="sumbar"></dl>
      <div class="note" id="note" hidden></div>
      <div id="groups" class="groups"></div>
      <p class="mu server" id="server"></p>
    </main>
    <div class="bar">
      <div>
        <button type="button" class="bt dg" id="delete"></button>
        <span class="sp"></span>
        <span id="progress" class="mu" role="status"></span>
        <button type="button" class="bt pr send" id="send" disabled></button>
      </div>
    </div>
    <div id="toast" class="toast" role="status" hidden></div>
    <dialog id="dlg" class="dlg" aria-labelledby="dlg-t" aria-describedby="dlg-b">
      <h2 id="dlg-t"></h2>
      <p id="dlg-b"></p>
      <div class="ac">
        <button type="button" class="bt" id="dlg-no"></button>
        <button type="button" class="bt pr" id="dlg-ok"></button>
      </div>
    </dialog>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
