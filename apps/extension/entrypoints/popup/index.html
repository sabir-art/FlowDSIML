<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>TutoClick</title>
  </head>
  <body>
    <main>
      <header>
        <!-- L21-01 : logo clair ou sombre selon le thème du navigateur -->
        <picture class="logo">
          <source srcset="/logo-tutoclick-compact-sombre.svg" media="(prefers-color-scheme: dark)" />
          <img src="/logo-tutoclick-compact.svg" width="98" height="31" alt="TutoClick" />
        </picture>
        <span class="muted" data-i18n="subtitle"></span>
      </header>
      <div id="error" class="alert" role="alert" hidden></div>

      <form id="login" hidden novalidate>
        <label for="email" data-i18n="email"></label>
        <input id="email" type="email" autocomplete="email" required />
        <label for="password" data-i18n="password"></label>
        <input id="password" type="password" autocomplete="current-password" required />
        <button type="submit" class="btn btn-primary">
          <i data-lucide="log-in"></i><span data-i18n="signIn"></span>
        </button>
        <p class="muted small">
          <span data-i18n="noAccount"></span>
          <a id="signup-link" target="_blank" rel="noopener" data-i18n="signUp"></a>
        </p>
      </form>

      <section id="setup" hidden>
        <label for="workspace" data-i18n="workspace"></label>
        <select id="workspace"></select>
        <label for="title" data-i18n="demoTitle"></label>
        <input id="title" maxlength="160" />
        <fieldset class="types">
          <legend data-i18n="captureType"></legend>
          <label class="type-card"
            ><input type="radio" name="mode" value="clicks" checked /><i data-lucide="mouse-pointer-click"></i
            ><span><b data-i18n="typeClicks"></b><small data-i18n="typeClicksHelp"></small></span
          ></label>
          <label class="type-card"
            ><input type="radio" name="mode" value="video" /><i data-lucide="film"></i
            ><span><b data-i18n="typeVideo"></b><small data-i18n="typeVideoHelp"></small></span
          ></label>
          <label class="type-card"
            ><input type="radio" name="mode" value="mobile" /><i data-lucide="smartphone"></i
            ><span><b data-i18n="typeMobile"></b><small data-i18n="typeMobileHelp"></small></span
          ></label>
          <label class="type-card"
            ><input type="radio" name="mode" value="html" /><i data-lucide="code"></i
            ><span><b data-i18n="typeHtml"></b><small data-i18n="typeHtmlHelp"></small></span
          ></label>
        </fieldset>
        <p id="opt-html" class="muted small opts" data-i18n="htmlHelp" hidden></p>
        <div id="opt-video" class="opts" hidden>
          <label class="check"><input type="checkbox" id="mic" /><span data-i18n="optMic"></span></label>
          <label class="check"
            ><input type="checkbox" id="webcam" /><span data-i18n="optWebcam"></span
          ></label>
          <label class="check"
            ><input type="checkbox" checked disabled /><span data-i18n="optCheck"></span
          ></label>
          <p class="muted small" data-i18n="videoHelp"></p>
        </div>
        <div id="opt-mobile" class="opts" hidden>
          <label for="device" data-i18n="device"></label>
          <select id="device">
            <option value="phone" data-i18n="devicePhone"></option>
            <option value="large" data-i18n="deviceLarge"></option>
            <option value="tablet" data-i18n="deviceTablet"></option>
            <option value="custom" data-i18n="deviceCustom"></option>
          </select>
          <div id="custom-size" class="row" hidden>
            <span
              ><label for="vw" data-i18n="width"></label
              ><input id="vw" type="number" min="320" max="1280" value="390" inputmode="numeric"
            /></span>
            <span
              ><label for="vh" data-i18n="height"></label
              ><input id="vh" type="number" min="480" max="1400" value="844" inputmode="numeric"
            /></span>
          </div>
          <fieldset class="inline">
            <legend data-i18n="orientation"></legend>
            <label class="check"
              ><input type="radio" name="orient" value="portrait" checked /><span data-i18n="portrait"></span
            ></label>
            <label class="check"
              ><input type="radio" name="orient" value="landscape" /><span data-i18n="landscape"></span
            ></label>
          </fieldset>
          <p class="muted small" data-i18n="mobileHelp"></p>
        </div>
        <button id="start" class="btn btn-accent">
          <!-- L21-01 : icône selon le type de capture (smartphone pour le format mobile) -->
          <span class="start-ico" data-for="clicks"><i data-lucide="video"></i></span
          ><span class="start-ico" data-for="video" hidden><i data-lucide="video"></i></span
          ><span class="start-ico" data-for="mobile" hidden><i data-lucide="smartphone"></i></span
          ><span class="start-ico" data-for="html" hidden><i data-lucide="code"></i></span
          ><span id="start-label" data-i18n="start"></span>
        </button>
        <p class="muted small" id="hint" data-i18n="hint"></p>
        <p class="small">
          <a id="logout" href="#" class="link-icon"
            ><i data-lucide="log-out"></i><span data-i18n="signOut"></span
          ></a>
        </p>
      </section>

      <section id="recording" hidden>
        <p class="rec" id="rec-label" aria-live="polite"></p>
        <p id="count" aria-live="polite"></p>
        <div class="row">
          <button id="pause" class="btn">
            <i data-lucide="pause" id="pause-icon"></i><span id="pause-label"></span>
          </button>
          <button id="stop" class="btn btn-primary">
            <i data-lucide="check"></i><span data-i18n="finish"></span>
          </button>
        </div>
        <button id="cancel" class="btn btn-ghost-danger">
          <i data-lucide="x"></i><span data-i18n="cancel"></span>
        </button>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
