<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vérification de la vidéo</title>
  </head>
  <body>
    <main id="main" tabindex="-1">
      <header class="vr-head">
        <img class="logo" src="/symbole-tutoclick.svg" width="36" height="36" alt="TutoClick" />
        <div>
          <h1 data-i18n="vrTitle"></h1>
          <p class="muted" id="meta"></p>
        </div>
      </header>
      <div id="alert" class="alert" role="alert" hidden></div>
      <section class="vr-video">
        <video id="video" controls playsinline aria-label=""></video>
      </section>
      <section aria-labelledby="kf-h">
        <h2 id="kf-h" data-i18n="vrFrames"></h2>
        <p class="muted" data-i18n="vrFramesHelp"></p>
        <p class="note" id="blurred"></p>
        <p class="muted small" id="zone-help" data-i18n="vrZoneHelp"></p>
        <ul id="frames" class="vr-frames"></ul>
      </section>
      <div class="vr-actions">
        <button type="button" id="delete" class="btn btn-danger-outline" data-i18n="vrDelete"></button>
        <span class="grow"></span>
        <span id="progress" class="muted" role="status"></span>
        <span id="reason" class="reason" hidden></span>
        <button type="button" id="send" class="btn btn-primary" data-i18n="vrSend"></button>
      </div>
    </main>
    <dialog id="confirm" class="vr-confirm" aria-labelledby="confirm-t" aria-describedby="confirm-d">
      <h2 id="confirm-t" data-i18n="vrConfirmTitle"></h2>
      <p id="confirm-d" data-i18n="vrConfirmBody"></p>
      <div class="vr-confirm-actions">
        <button type="button" id="confirm-no" class="btn btn-secondary" data-i18n="vrCancel"></button>
        <button type="button" id="confirm-yes" class="btn btn-danger" data-i18n="vrDelete"></button>
      </div>
    </dialog>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
