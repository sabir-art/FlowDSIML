<!doctype html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Navigation et Paramètres (lot L48-A) — TutoClick</title>
<link rel="icon" href="../../brand-tutoclic/production/favicon.svg">
<link rel="stylesheet" href="refonte.css">
<link rel="stylesheet" href="ui2.css">
<script src="ui2.js"></script>
<style>
  /* L48-A, reprise UI (composants §17). Spec : docs/ux/specs/l48a-navigation.md. Données fictives. */
  .n-wrap { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 40px; }
  .n-fold { display: flex; flex-direction: column; gap: 2px; padding-top: 4px; }
  .n-fold h2 { margin: 0 12px 12px; font-size: 13px; font-weight: 600; color: var(--fd-color-text-muted); }
  .n-fold a { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border-radius: 10px; font-size: 14px; color: var(--fd-color-text); text-decoration: none; }
  .n-fold a .c { margin-left: auto; font-size: 13px; color: var(--fd-color-text-muted); font-variant-numeric: tabular-nums; }
  .n-fold a[aria-current] { background: var(--fd-color-surface); font-weight: 600; }
  .n-fold a.sub { padding-left: 28px; }
  .n-fold a.add { color: var(--fd-color-primary); font-weight: 600; }
  .n-fold a.drop { box-shadow: inset 0 0 0 2px var(--fd-color-primary); }
  .n-fold hr { border: 0; border-top: 1px solid var(--fd-color-border); margin: 12px 12px; }
  .n-fold svg { color: var(--fd-color-text-muted); }
  .n-bar { display: flex; align-items: center; gap: 8px; }
  .n-flt { display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 16px; border-radius: 999px; background: var(--fd-color-surface); font-size: 14px; white-space: nowrap; }
  .n-flt span { color: var(--fd-color-text-muted); } .n-bar .end { margin-left: auto; display: flex; gap: 8px; }
  .n-ib { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 999px; background: var(--fd-color-surface); }
  .n-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; }
  .n-card { border-radius: 20px; background: var(--fd-color-surface); overflow: hidden; }
  .n-card i { display: block; aspect-ratio: 16 / 9; background: var(--fd-color-surface-sunken); }
  .n-card div { padding: 16px 20px 20px; } .n-card b { display: block; font-size: 15px; } .n-card small { font-size: 13px; color: var(--fd-color-text-muted); }
  .n-snav { display: flex; flex-direction: column; gap: 2px; padding-top: 4px; }
  .n-snav b { margin: 16px 12px 6px; font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--fd-color-text-muted); } .n-snav b:first-child { margin-top: 0; }
  .n-snav a { display: flex; align-items: center; height: 36px; padding: 0 12px; border-radius: 10px; font-size: 14px; color: var(--fd-color-text); text-decoration: none; }
  .n-snav a[aria-current] { background: var(--fd-color-surface); font-weight: 600; }
  .n-snav a em { margin-left: auto; font-style: normal; font-size: 12px; color: var(--fd-color-text-muted); }
  .n-mem { gap: 16px; } .n-mem i { width: 36px; height: 36px; border-radius: 50%; background: var(--fd-color-surface-sunken); display: grid; place-items: center; font: 600 13px var(--fd-font-sans); font-style: normal; flex: none; }
  .n-mem span:nth-child(2) { flex: 1; } .n-mem small { display: block; font-size: 13px; color: var(--fd-color-text-muted); }
  .n-role { font-size: 14px; color: var(--fd-color-text); display: inline-flex; align-items: center; gap: 4px; }
</style>
</head>
<body>
<main class="u2">
  <header class="u2-head"><div><small>Lot L48-A · Reprise UI</small><h1>Navigation, dossiers et paramètres</h1><p>Trois zones dans la barre latérale, une colonne Dossiers en texte simple, des paramètres groupés. Moins d’icônes, moins de cadres : la hiérarchie vient de la typographie et de l’espace.</p></div></header>
  <div id="a1"></div><div id="a2"></div>
  <section class="u2-sec"><h2>En sombre : glisser une démo sur un dossier</h2><div id="a3"></div></section>
</main>
<script>
  const { I, app, pair } = U2;
  const fold = (drop) => `<nav class="n-fold" aria-label="Dossiers"><h2>Dossiers</h2>
    <a href="#">Toutes les démos<span class="c">24</span></a><a href="#">Mes démos<span class="c">9</span></a><hr>
    <a href="#" class="${drop ? 'drop' : ''}">Prise en main<span class="c">6</span></a><a href="#" aria-current="true">Procédures<span class="c">8</span></a><a href="#" class="sub">Logiciel métier<span class="c">5</span></a><a href="#">${I('lock', 14)}Communication interne<span class="c">4</span></a><a href="#" class="add">${I('plus', 16)}Nouveau dossier</a><hr>
    <a href="#">Archivées<span class="c">3</span></a></nav>`;
  const cards = [['Créer un rapport', 'Publiée · 120 vues'], ['Saisir un entretien', 'Publiée · 86 vues'], ['Exporter une liste', 'Brouillon'], ['Planifier un atelier', 'Publiée · 40 vues'], ['Mettre à jour un dossier', 'Publiée · 22 vues'], ['Joindre un justificatif', 'Brouillon']];
  const demos = (drop) => `<div class="n-wrap">${fold(drop)}<div style="display:flex;flex-direction:column;gap:24px;min-width:0">
    <div class="u2-top"><div style="flex:1"><p class="u2-crumb">Démos</p><h1>Procédures</h1></div><button class="fd-btn fd-btn--ghost fd-btn--icon" type="button" aria-label="Rechercher">${I('search')}</button><button class="fd-btn fd-btn--primary fd-btn--lg" type="button">${I('plus')}Nouvelle démo</button></div>
    <div class="n-bar"><span class="fd-segmented" role="group" aria-label="Statut"><button type="button" aria-pressed="true">Toutes</button><button type="button" aria-pressed="false">Publiées</button><button type="button" aria-pressed="false">Brouillons</button></span><span class="n-flt"><span>Créé par :</span>Tous${I('down', 16)}</span><span class="n-flt"><span>Étiquettes :</span>Toutes${I('down', 16)}</span><span class="end"><span class="n-ib" role="button" aria-label="Tri : Modifiées récemment">${I('sort')}</span><span class="fd-segmented" role="group" aria-label="Affichage"><button type="button" aria-pressed="true" aria-label="Grille">${I('grid', 16)}</button><button type="button" aria-pressed="false" aria-label="Liste">${I('list', 16)}</button></span></span></div>
    <div class="n-grid">${cards.map(([t, s], i) => `<article class="n-card"${drop && i === 0 ? ' style="opacity:.4"' : ''}><i></i><div><b>${t}</b><small>${s}</small></div></article>`).join('')}</div></div></div>`;
  document.getElementById('a1').outerHTML = pair('Démos : barre latérale en trois zones et colonne Dossiers', app('demos', demos(false)), 'img/avant/l47-l48-demos.png', 'Page Démos actuelle', 'Contenus en haut, utilitaires en bas. Les dossiers sont une liste de texte : compteur discret à droite, sélection en fond blanc, un cadenas seulement pour l’accès restreint.');
  const set = `<div class="n-wrap"><nav class="n-snav" aria-label="Sections des paramètres"><b>Espace</b><a href="#">Général</a><a href="#" aria-current="page">Équipe</a><a href="#">Utilisation</a><a href="#">Sécurité</a><a href="#">Confidentialité</a><b>Marque</b><a href="#">Thème et couleurs</a><a href="#">Page publique</a><a href="#">Domaine<em>Bientôt</em></a><b>Contenu</b><a href="#">Variables</a><a href="#">Glossaire</a><a href="#">Étiquettes</a><a href="#">Assistance IA</a><b>Connexions</b><a href="#">Intégrations</a><b>Mon compte</b><a href="#">Profil</a><a href="#">Notifications<em>Bientôt</em></a></nav>
    <div style="display:flex;flex-direction:column;gap:24px;min-width:0"><div class="u2-top"><div style="flex:1"><p class="u2-crumb">Paramètres › Espace</p><h1>Équipe</h1></div><button class="fd-btn fd-btn--primary" type="button">${I('plus')}Inviter</button></div>
    <section class="u2-card" style="padding:8px 24px"><ul class="u2-list">${[['CM', 'Camille Martin', 'camille.martin@example.com', 'Propriétaire'], ['LF', 'Léa Fictive', 'lea.fictive@example.com', 'Admin'], ['NT', 'Noé Test', 'noe.test@example.com', 'Éditeur'], ['LM', 'Lucas Modèle', 'lucas.modele@example.com', 'Lecteur']].map(([a, n, e, r]) => `<li class="n-mem" style="min-height:72px"><i>${a}</i><span><b style="font-weight:600">${n}</b><small>${e}</small></span><span class="n-role">${r}${I('down', 16)}</span></li>`).join('')}</ul></section></div></div>`;
  document.getElementById('a2').outerHTML = pair('Paramètres : cinq groupes et un fil d’Ariane', app('settings', set), 'img/avant/l48a-parametres.png', 'Paramètres actuels : 12 entrées à plat', '« Bientôt » en texte discret à droite, sans pastille. La liste des membres sans cadre ni icône inutile.');
  document.getElementById('a3').innerHTML = app('demos', demos(true), { theme: 'dark' });
</script>
</body>
</html>
