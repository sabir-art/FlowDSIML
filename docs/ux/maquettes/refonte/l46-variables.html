<!doctype html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Variables lisibles (lot L46) — TutoClick</title>
<link rel="icon" href="../../brand-tutoclic/production/favicon.svg">
<link rel="stylesheet" href="refonte.css">
<link rel="stylesheet" href="ui2.css">
<script src="ui2.js"></script>
<style>
  /* L46, reprise UI (composants §17). Spec : docs/ux/specs/l46-variables.md. Données fictives. */
  .v-ed { display: grid; grid-template-columns: minmax(0, 1fr) 380px; height: 780px; }
  .v-canvas { background: var(--fd-color-surface-sunken); display: grid; place-items: center; position: relative; }
  .v-bub { position: absolute; left: 22%; top: 52%; width: 300px; padding: 16px 18px; border-radius: 14px; background: #fff; color: #080808; box-shadow: 0 8px 24px rgb(8 10 14 / .16); font-size: 15px; line-height: 1.45; }
  .v-bub b { display: block; margin-bottom: 4px; }
  .v-panel { background: var(--fd-color-surface); padding: 24px; display: flex; flex-direction: column; gap: 20px; position: relative; }
  .v-panel h3 { margin: 0; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; color: var(--fd-color-text-muted); }
  .v-lab { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
  .v-rte { border: 1px solid var(--fd-color-border-strong, var(--fd-color-border)); border-radius: 14px; }
  .v-rte.focus { border-color: var(--fd-color-primary); box-shadow: var(--fd-shadow-focus); }
  .v-tools { display: flex; align-items: center; gap: 2px; padding: 4px 6px; border-bottom: 1px solid var(--fd-color-border); }
  .v-tools button { all: unset; display: grid; place-items: center; width: 32px; height: 32px; border-radius: 8px; color: var(--fd-color-text-muted); cursor: pointer; }
  .v-tools .add { margin-left: auto; width: auto; padding: 0 10px; display: inline-flex; gap: 6px; font-size: 14px; font-weight: 600; color: var(--fd-color-primary); }
  .v-body { padding: 12px 14px; min-height: 96px; font-size: 15px; line-height: 26px; }
  .v-pill { display: inline-flex; align-items: center; height: 24px; padding: 0 8px; border-radius: 6px; background: var(--fd-color-primary-soft); color: var(--fd-color-primary-soft-text); font-size: 14px; font-weight: 600; vertical-align: 1px; }
  .v-pop { position: absolute; left: 24px; right: 24px; top: 300px; border-radius: 16px; background: var(--fd-color-surface); box-shadow: 0 16px 48px rgb(8 10 14 / .18); overflow: hidden; }
  .v-pop .s { padding: 12px; border-bottom: 1px solid var(--fd-color-border); } .v-pop .s .fd-input { width: 100%; }
  .v-pop .tip { margin: 12px 16px 0; font-size: 13px; color: var(--fd-color-text-muted); line-height: 1.45; }
  .v-pop .g { padding: 8px 8px 4px; } .v-pop .g h4 { margin: 8px 8px 4px; font-size: 12px; font-weight: 600; color: var(--fd-color-text-muted); }
  .v-opt { all: unset; box-sizing: border-box; width: 100%; display: flex; align-items: baseline; gap: 12px; padding: 10px 8px; border-radius: 10px; cursor: pointer; font-size: 15px; }
  .v-opt span { flex: 1; } .v-opt small { display: block; font-size: 13px; color: var(--fd-color-text-muted); }
  .v-opt em { font-style: normal; font-size: 13px; color: var(--fd-color-text-muted); }
  .v-opt.act { background: var(--fd-color-surface-sunken); }
  .v-tbl { width: 100%; border-collapse: collapse; font-size: 15px; }
  .v-tbl th { text-align: left; font-size: 13px; font-weight: 500; color: var(--fd-color-text-muted); padding: 0 16px 12px 0; }
  .v-tbl td { padding: 16px 16px 16px 0; border-top: 1px solid var(--fd-color-border); }
  .v-tbl td small { display: block; font-size: 13px; color: var(--fd-color-text-muted); }
  .v-fb { width: 360px; padding: 20px; border-radius: 16px; background: var(--fd-color-surface); box-shadow: 0 16px 48px rgb(8 10 14 / .14); display: flex; flex-direction: column; gap: 14px; }
  .v-fb h4 { margin: 0; font-size: 16px; } .v-fb p { margin: 0; font-size: 13px; color: var(--fd-color-text-muted); }
</style>
</head>
<body>
<main class="u2">
  <header class="u2-head"><div><small>Lot L46 · Reprise UI</small><h1>Variables lisibles</h1><p>Dans le texte, une pastille avec un nom en français ; dans le catalogue, un nom et un exemple. Le reste (description, repli) apparaît au moment où on en a besoin.</p></div></header>
  <div id="a1"></div><div id="a2"></div>
  <section class="u2-sec"><h2>Réglage d’une pastille, et en sombre</h2><div class="u2-row" id="a3"></div></section>
</main>
<script>
  const { I, app, pair } = U2;
  const pill = (t) => `<span class="v-pill" contenteditable="false" aria-label="Variable : ${t}">${t}</span>`;
  const opt = (t, ex, act) => `<button class="v-opt${act ? ' act' : ''}" type="button"><span>${t}</span><em>${ex}</em></button>`;
  const editor = (open) => `<div class="v-ed"><div class="v-canvas"><div class="u2-fake" aria-hidden="true"><div><i style="width:40%"></i><i style="width:70%"></i></div></div><div class="v-bub"><b>Créez une opportunité</b>Bienvenue Camille : cliquez sur « Nouvelle opportunité ».</div></div>
    <aside class="v-panel" aria-label="Bulle"><h3>Texte de la bulle</h3>
      <div><span class="v-lab">Titre</span><input class="fd-input" style="width:100%" value="Créez une opportunité"></div>
      <div><span class="v-lab" id="vt">Texte</span><div class="v-rte${open ? ' focus' : ''}"><div class="v-tools" role="toolbar" aria-label="Mise en forme"><button type="button" aria-label="Gras">${I('bold', 16)}</button><button type="button" aria-label="Italique">${I('italic', 16)}</button><button class="add" type="button" aria-haspopup="dialog" aria-expanded="${open}">${I('plus', 16)}Variable</button></div>
        <div class="v-body" role="textbox" aria-multiline="true" aria-labelledby="vt">Bienvenue ${pill('Prénom du visiteur')} : cliquez sur « Nouvelle opportunité ».</div></div></div>
      ${open ? `<div class="v-pop" role="dialog" aria-label="Insérer une variable"><div class="s"><input class="fd-input" placeholder="Rechercher une variable"></div><p class="tip">Une variable s’adapte à chaque visiteur : « Bonjour Prénom » devient « Bonjour Camille ».</p>
        <div class="g"><h4>Visiteur</h4>${opt('Prénom du visiteur', 'Camille', 1)}${opt('Nom du visiteur', 'Martin')}${opt('Fonction', 'Conseillère')}</div><div class="g"><h4>Entreprise</h4>${opt('Nom de l’entreprise', 'Acme Formation')}</div><div class="g"><h4>Votre espace</h4>${opt('Nom du logiciel', 'ExampleCRM')}</div></div>` : ''}
    </aside></div>`;
  document.getElementById('a1').outerHTML = pair('Éditeur : pastille lisible, catalogue court', app('', editor(true), { bare: true, h: 780 }).replace('<main class="u2-main">', '<main class="u2-main" style="padding:0">'), 'img/avant/l46-editeur.png', 'Panneau actuel : {{company|chez vous}} en brut', 'Le catalogue montre le nom et un exemple ; la description apparaît dans l’aide et au survol. Le canevas affiche déjà « Camille ».');
  const settings = `<div class="u2-top"><div style="flex:1"><p class="u2-crumb">Paramètres › Contenu</p><h1>Variables</h1></div><button class="fd-btn fd-btn--primary" type="button">${I('plus')}Nouvelle variable</button></div>
    <section class="u2-card"><table class="v-tbl"><thead><tr><th>Nom</th><th>Exemple</th><th>Si inconnu</th><th style="text-align:right">Utilisée dans</th></tr></thead><tbody>
      <tr><td>Nom du logiciel<small>Le logiciel présenté dans vos démos</small></td><td>ExampleCRM</td><td>notre logiciel</td><td style="text-align:right">12 démos</td></tr>
      <tr><td>Lien vers l’intranet<small>Pour les boutons de fin</small></td><td>intranet.example</td><td class="u2-muted">—</td><td style="text-align:right">3 démos</td></tr></tbody></table></section>`;
  document.getElementById('a2').outerHTML = pair('Paramètres › Variables : un tableau qui se lit', app('settings', settings, { h: 560 }), 'img/avant/l46-variables.png', 'Variables actuelles : clés techniques {{company}}', 'Plus de clé technique ; la description sous le nom, en gris ; les chiffres alignés à droite.');
  document.getElementById('a3').innerHTML = `<div class="v-fb" role="dialog" aria-labelledby="fb"><h4 id="fb">Prénom du visiteur</h4><p>Exemple : Camille</p><div><label class="v-lab" for="fbi">Si inconnu, afficher</label><input id="fbi" class="fd-input" style="width:100%" value="vous"></div><div style="display:flex;justify-content:space-between"><button class="fd-btn fd-btn--ghost" type="button">Retirer</button><button class="fd-btn fd-btn--primary" type="button">Appliquer</button></div></div>
    <div style="flex:1;min-width:900px">${app('', editor(false), { bare: true, theme: 'dark', h: 560 }).replace('<main class="u2-main">', '<main class="u2-main" style="padding:0">').replace('height: 780px', '')}</div>`;
</script>
</body>
</html>
