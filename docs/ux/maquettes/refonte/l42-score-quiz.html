<!doctype html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Score du quiz (lot L42) — TutoClick</title>
<link rel="icon" href="../../brand-tutoclic/production/favicon.svg">
<link rel="stylesheet" href="refonte.css">
<link rel="stylesheet" href="ui2.css">
<script src="ui2.js"></script>
<style>
  /* L42, reprise UI (composants §17). L'anneau livré (d6aa3e4) est conservé ; on allège ce qui l'entoure. Spec : docs/ux/specs/l42-score-quiz.md. Données fictives. */
  .q-stage { min-height: 760px; display: grid; place-items: center; padding: 40px; }
  .q-card { width: 560px; max-width: 100%; background: var(--fd-color-surface); border-radius: 24px; padding: 40px; display: flex; flex-direction: column; align-items: center; gap: 24px; text-align: center; }
  .q-ring { position: relative; width: 168px; height: 168px; }
  .q-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .q-ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 40px; }
  .q-card h1 { margin: 0; font-size: 26px; } .q-card > p { margin: -12px 0 0; font-size: 15px; color: var(--fd-color-text-muted); }
  .q-list { width: 100%; text-align: left; }
  .q-list li { gap: 12px; min-height: 52px !important; font-size: 15px; }
  .q-list li span { flex: 1; } .q-list a { font-size: 14px; font-weight: 600; color: var(--fd-color-primary); text-decoration: none; }
  .q-acts { display: flex; gap: 8px; }
</style>
</head>
<body>
<main class="u2">
  <header class="u2-head"><div><small>Lot L42 · Reprise UI</small><h1>Résultat du quiz</h1><p>L’anneau livré est conforme et reste tel quel. Autour : un titre, une ligne, la liste des questions, deux actions. Le badge « Pas encore validé » et le paragraphe redisaient le titre.</p></div></header>
  <div id="a1"></div>
  <section class="u2-sec"><h2>Réussite, en sombre</h2><div class="u2-row" id="a2"></div></section>
</main>
<script>
  const { I, app, pair } = U2;
  const ring = (p, ok) => { const r = 74, C = 2 * Math.PI * r; return `<div class="q-ring" role="img" aria-label="Score : ${p} %"><svg viewBox="0 0 168 168" aria-hidden="true"><circle cx="84" cy="84" r="${r}" fill="none" stroke="var(--fd-color-surface-sunken)" stroke-width="12" stroke-dasharray="${C * .7 - 3} 6 ${C}"/><circle cx="84" cy="84" r="${r}" fill="none" stroke="${ok ? 'var(--fd-color-primary)' : 'var(--fd-color-text-muted)'}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C * p / 100} ${C}"/></svg><b>${p} %</b></div>`; };
  const q = (ok, t, link) => `<li><span class="${ok ? 'u2-ok' : 'u2-bad'}" style="flex:none">${I(ok ? 'check' : 'x', 18)}</span><span>${t}</span>${link ? '<a href="#">Revoir</a>' : ''}</li>`;
  const fail = `<div class="q-stage"><section class="q-card" aria-labelledby="qt">${ring(33, false)}<span class="u2-s" style="margin-top:-12px">Seuil de validation : 70 %</span><h1 id="qt" tabindex="-1">Encore un peu d’entraînement</h1><p>1 bonne réponse sur 3 · il vous reste 2 tentatives</p>
    <ul class="u2-list q-list">${q(false, 'Où créer un rendez-vous ?', 1)}${q(false, 'Quelles informations sont obligatoires ?', 1)}${q(true, 'Un rendez-vous peut être déplacé.')}</ul>
    <div class="q-acts"><button class="fd-btn" type="button">Revoir le module</button><button class="fd-btn fd-btn--primary" type="button">Réessayer le quiz</button></div></section></div>`;
  document.getElementById('a1').outerHTML = pair('Échec : moins de texte, même information', app('', fail, { bare: true, h: 760 }).replace('<main class="u2-main">', '<main class="u2-main" style="padding:0">'), 'img/avant/l42-echec.png', 'Résultat livré (d6aa3e4)', '« Revoir » sur chaque question ratée, pas seulement la première ; le reste du texte d’explication passe dans la ligne sous le titre.', 'Avant (livré)');
  const ok = `<div class="q-stage" style="min-height:620px"><section class="q-card">${ring(100, true)}<span class="u2-s" style="margin-top:-12px">Seuil de validation : 70 %</span><h1>Module validé</h1><p>3 bonnes réponses sur 3</p><div class="q-acts"><button class="fd-btn" type="button">Repasser le quiz</button><button class="fd-btn fd-btn--primary" type="button">Module suivant</button></div></section></div>`;
  document.getElementById('a2').innerHTML = `<div style="flex:1">${app('', ok, { bare: true, h: 620 }).replace('<main class="u2-main">', '<main class="u2-main" style="padding:0">')}</div><div style="flex:1">${app('', ok, { bare: true, theme: 'dark', h: 620 }).replace('<main class="u2-main">', '<main class="u2-main" style="padding:0">')}</div>`;
</script>
</body>
</html>
