<!doctype html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Composeur de message (lot L43) — TutoClick</title>
<link rel="icon" href="../../brand-tutoclic/production/favicon.svg">
<link rel="stylesheet" href="refonte.css">
<link rel="stylesheet" href="ui2.css">
<script src="ui2.js"></script>
<style>
  /* L43 révision 2, reprise UI (composants §17). Spec : docs/ux/specs/l43-composeur.md. Données fictives. */
  .m-ed { display: grid; grid-template-columns: minmax(0, 1fr) 400px; height: 760px; }
  .m-canvas { background: var(--fd-color-surface-sunken); display: grid; place-items: center; }
  .m-side { background: var(--fd-color-surface); display: flex; flex-direction: column; }
  .m-head { padding: 24px 24px 8px; } .m-head h2 { margin: 0; font-size: 18px; } .m-head p { margin: 4px 0 0; font-size: 13px; color: var(--fd-color-text-muted); }
  .m-thread { flex: 1; padding: 8px 24px; display: flex; flex-direction: column; gap: 20px; overflow: hidden; }
  .m-msg { display: flex; gap: 12px; font-size: 15px; line-height: 1.5; }
  .m-msg i { width: 32px; height: 32px; border-radius: 50%; background: var(--fd-color-surface-sunken); display: grid; place-items: center; font: 600 12px var(--fd-font-sans); font-style: normal; flex: none; }
  .m-msg b { font-size: 14px; } .m-msg small { font-size: 13px; color: var(--fd-color-text-muted); margin-left: 6px; } .m-msg p { margin: 2px 0 0; }
  .m-msg .at { color: var(--fd-color-primary); font-weight: 600; }
  .m-foot { padding: 16px 24px 24px; position: relative; }
  .m-comp { border: 1px solid var(--fd-color-border-strong, var(--fd-color-border)); border-radius: 16px; }
  .m-comp.focus { border-color: var(--fd-color-primary); box-shadow: var(--fd-shadow-focus); }
  .m-comp .tx { padding: 12px 16px 4px; font-size: 15px; line-height: 22px; min-height: 22px; }
  .m-comp .tx.ph { color: var(--fd-color-text-muted); }
  .m-comp .bar { display: flex; align-items: center; padding: 4px 8px 8px; }
  .m-comp .tool { all: unset; display: grid; place-items: center; width: 32px; height: 32px; border-radius: 8px; color: var(--fd-color-text-muted); cursor: pointer; }
  .m-comp .send { margin-left: auto; width: 32px; height: 32px; border-radius: 50%; border: 0; display: grid; place-items: center; background: var(--fd-color-primary); color: var(--fd-color-on-primary, #fff); }
  .m-comp .send:disabled { background: var(--fd-color-surface-sunken); color: var(--fd-color-text-muted); }
  .m-men { position: absolute; left: 24px; bottom: 132px; width: 260px; padding: 6px; border-radius: 14px; background: var(--fd-color-surface); box-shadow: 0 16px 48px rgb(8 10 14 / .18); }
  .m-men div { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; font-size: 15px; }
  .m-men div.act { background: var(--fd-color-surface-sunken); }
  .m-men i { width: 28px; height: 28px; border-radius: 50%; background: var(--fd-color-surface-sunken); display: grid; place-items: center; font: 600 11px var(--fd-font-sans); font-style: normal; }
  .m-men div.act i { background: var(--fd-color-surface); }
</style>
</head>
<body>
<main class="u2">
  <header class="u2-head"><div><small>Lot L43 · Reprise UI</small><h1>Composeur de message</h1><p>Un seul cadre : le texte, puis une barre discrète avec @ et l’envoi. Les commentaires passent dans un panneau latéral, comme l’assistant, au lieu d’un tiroir qui écrase le canevas.</p></div></header>
  <div id="a1"></div>
  <section class="u2-sec"><h2>Mention ouverte, et en sombre</h2><div id="a2"></div></section>
</main>
<script>
  const { I, app, pair } = U2;
  const comp = (txt, focus) => `<form class="m-comp${focus ? ' focus' : ''}" onsubmit="return false"><label class="sr-only" for="c${txt.length}">Nouveau commentaire</label><div class="tx${txt ? '' : ' ph'}" id="c${txt.length}" role="textbox" contenteditable="true">${txt || 'Écrire un commentaire, @ pour mentionner'}</div><div class="bar"><button class="tool" type="button" aria-label="Mentionner">${I('at')}</button><button class="send" type="submit" aria-label="Envoyer"${txt ? '' : ' disabled'}>${I('send', 18)}</button></div></form>`;
  const side = (txt, men, focus) => `<div class="m-ed"><div class="m-canvas"><div class="u2-fake" aria-hidden="true"><div><i style="width:40%"></i><i style="width:70%"></i></div></div></div>
    <aside class="m-side" aria-labelledby="mh"><div class="m-head"><h2 id="mh">Commentaires · Étape 1</h2><p>Internes à l’équipe, jamais publiés</p></div>
      <div class="m-thread"><div class="m-msg"><i>NT</i><div><b>Noé Test</b><small>il y a 2 h</small><p>La capture de l’étape 2 date d’avant la mise à jour.</p></div></div><div class="m-msg"><i>LF</i><div><b>Léa Fictive</b><small>il y a 1 h</small><p><span class="at">@Noé Test</span> je la refais demain.</p></div></div></div>
      <div class="m-foot">${men ? `<div class="m-men" role="listbox" aria-label="Mentionner"><div class="act" role="option" aria-selected="true"><i>LF</i>Léa Fictive</div><div role="option" aria-selected="false"><i>LM</i>Lucas Modèle</div></div>` : ''}${comp(txt, focus)}</div></aside></div>`;
  document.getElementById('a1').outerHTML = pair('Commentaires de l’éditeur', app('', side('Merci, je vérifie l’étape 3 aussi.', false, true), { bare: true, h: 760 }).replace('<main class="u2-main">', '<main class="u2-main" style="padding:0">'), 'img/avant/l43-commentaires.png', 'Composeur actuel : avatar, champ, bouton à côté, aide sous le champ', 'Pas d’avatar devant le champ, pas de ligne d’aide dessous ; l’envoi s’active quand on écrit.');
  document.getElementById('a2').innerHTML = `<div class="u2-row"><div style="flex:1">${app('', side('Bien vu @L', true, true), { bare: true, h: 760 }).replace('<main class="u2-main">', '<main class="u2-main" style="padding:0">')}</div></div><div style="margin-top:24px">${app('', side('', false, false), { bare: true, theme: 'dark', h: 760 }).replace('<main class="u2-main">', '<main class="u2-main" style="padding:0">')}</div>`;
</script>
</body>
</html>
