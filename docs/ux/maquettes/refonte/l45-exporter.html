<!doctype html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modale Exporter (lot L45) — TutoClick</title>
<link rel="icon" href="../../brand-tutoclic/production/favicon.svg">
<link rel="stylesheet" href="refonte.css">
<link rel="stylesheet" href="ui2.css">
<script src="ui2.js"></script>
<style>
  /* L45, reprise UI (composants §17). Spec : docs/ux/specs/l45-espacements.md §3. Données fictives. */
  .x-dlg { width: 980px; display: grid; grid-template-columns: minmax(0, 1fr) 340px; overflow: hidden; }
  .x-main { padding: 28px; display: flex; flex-direction: column; gap: 24px; }
  .x-main h2 { margin: 0; font-size: 22px; }
  .x-fmts { margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; }
  .x-fmts legend { padding: 0; margin-bottom: 8px; font-size: 14px; font-weight: 600; }
  .x-fmt { display: flex; align-items: center; gap: 14px; min-height: 60px; padding: 0 12px; border-radius: 12px; cursor: pointer; }
  .x-fmt input { width: 18px; height: 18px; margin: 0; accent-color: var(--fd-color-text); flex: none; }
  .x-fmt span { flex: 1; } .x-fmt b { display: block; font-size: 15px; font-weight: 600; } .x-fmt small { font-size: 13px; color: var(--fd-color-text-muted); }
  .x-fmt.on { background: var(--fd-color-surface-sunken); }
  .x-fmt.off { color: var(--fd-color-text-muted); cursor: not-allowed; } .x-fmt.off b { color: var(--fd-color-text-muted); }
  .x-fmt em { font-style: normal; font-size: 13px; color: var(--fd-color-text-muted); }
  .x-opts { display: flex; gap: 32px; font-size: 15px; } .x-opts label { display: flex; align-items: center; gap: 10px; }
  .x-foot { display: flex; align-items: center; gap: 8px; } .x-foot span { flex: 1; font-size: 13px; color: var(--fd-color-text-muted); }
  .x-prev { background: var(--fd-color-surface-sunken); padding: 28px; display: flex; flex-direction: column; gap: 12px; }
  .x-prev .p { background: #fff; color: #080808; border-radius: 8px; padding: 18px; font-size: 13px; line-height: 1.6; box-shadow: 0 4px 16px rgb(8 10 14 / .08); }
  .x-prev .p b { display: block; font-size: 15px; margin-bottom: 8px; }
</style>
</head>
<body>
<main class="u2">
  <header class="u2-head"><div><small>Lot L45 · Reprise UI</small><h1>Modale Exporter</h1><p>Une liste de formats lisible d’un coup d’œil : un nom, une ligne, le choix surligné en gris. Pas de pastille d’icône, pas de cadre par format, un seul encart retiré.</p></div></header>
  <div id="a1"></div>
</main>
<script>
  const { I, app, pair } = U2;
  const F = [['PDF', 'Étapes, captures et textes, à imprimer ou à joindre'], ['GIF animé', 'Boucle courte, sans son'], ['Version accessible (HTML)', 'Lisible au lecteur d’écran et au clavier', 1], ['Vidéo MP4', 'Avec sous-titres, créée dans le navigateur'], ['Hors ligne (.zip)', 'Démo autonome, ouvrable sans Internet', 0, 1]];
  const dlg = `<div class="u2-dlg x-dlg" role="dialog" aria-labelledby="xt"><div class="x-main"><div style="display:flex;align-items:center"><h2 id="xt" style="flex:1">Exporter « Créer une fiche usager »</h2><button class="fd-btn fd-btn--ghost fd-btn--icon" type="button" aria-label="Fermer">${I('x')}</button></div>
    <fieldset class="x-fmts"><legend>Format</legend>${F.map(([n, d, on, off]) => `<label class="x-fmt${on ? ' on' : ''}${off ? ' off' : ''}"><input type="radio" name="f" ${on ? 'checked' : ''} ${off ? 'disabled' : ''}><span><b>${n}</b><small>${d}</small></span>${off ? '<em>Bientôt</em>' : ''}</label>`).join('')}</fieldset>
    <div class="x-opts"><label><input type="checkbox" checked style="width:18px;height:18px;accent-color:var(--fd-color-text)">Captures d’écran</label><label><input type="checkbox" checked style="width:18px;height:18px;accent-color:var(--fd-color-text)">Texte des bulles</label></div>
    <div class="x-foot"><span>Les zones floutées restent floutées ; les commentaires ne sont jamais exportés.</span><button class="fd-btn" type="button">Annuler</button><button class="fd-btn fd-btn--primary" type="button">${I('download', 16)}Exporter</button></div></div>
    <aside class="x-prev" aria-label="Aperçu"><span class="u2-s">Aperçu</span><div class="p"><b>Créer une fiche usager</b>1 · Ouvrir le menu Usagers<br>2 · Filtrer par structure<br>3 · Cliquer sur « Ajouter »<br>4 · Renseigner l’identité<br>5 · Choisir la structure<br>6 · Vérifier<br>7 · Enregistrer</div></aside></div>`;
  document.getElementById('a1').outerHTML = pair('Format en liste', `<div class="u2-app u2-app--bare u2-scrim" style="min-height:720px"><main class="u2-main"></main>${dlg}</div>`, 'img/l45-avant-exporter.png', 'Modale actuelle : 5 cartes de format serrées', 'La sélection est un fond gris, pas un contour de couleur ; le bouton dit seulement « Exporter » ; l’encart de sécurité devient une ligne de pied.');
</script>
</body>
</html>
