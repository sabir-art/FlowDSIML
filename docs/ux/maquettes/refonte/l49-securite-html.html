<!doctype html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sécurité des captures HTML (lot L49) — TutoClick</title>
<link rel="icon" href="../../brand-tutoclic/production/favicon.svg">
<link rel="stylesheet" href="refonte.css">
<link rel="stylesheet" href="ui2.css">
<script src="ui2.js"></script>
<style>
  /* L49, reprise UI (composants §17). Spec : docs/ux/specs/l49-securite-html.md. Données fictives. */
  .s-set { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 40px; }
  .s-snav { display: flex; flex-direction: column; gap: 2px; padding-top: 4px; }
  .s-snav b { margin: 16px 12px 6px; font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--fd-color-text-muted); }
  .s-snav b:first-child { margin-top: 0; }
  .s-snav a { display: flex; align-items: center; height: 36px; padding: 0 12px; border-radius: 10px; font-size: 14px; color: var(--fd-color-text); text-decoration: none; }
  .s-snav a[aria-current] { background: var(--fd-color-surface); font-weight: 600; }
  .s-doms { display: flex; flex-direction: column; gap: 8px; margin: 4px 0 0 30px; }
  .s-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .s-chip { display: inline-flex; align-items: center; gap: 4px; height: 32px; padding: 0 4px 0 12px; border-radius: 999px; background: var(--fd-color-surface-sunken); font-size: 14px; }
  .s-chip button { all: unset; display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; cursor: pointer; color: var(--fd-color-text-muted); }
  .s-add { display: flex; gap: 8px; max-width: 420px; } .s-add .fd-input { flex: 1; }
  .s-ghost { opacity: .45; }
  /* Extension */
  .s-ext { width: 760px; max-width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
  .s-sum { display: flex; align-items: flex-start; gap: 14px; }
  .s-sum svg { margin-top: 2px; flex: none; color: var(--fd-color-text-muted); }
  .s-sum b { display: block; font-size: 18px; } .s-sum span { font-size: 15px; color: var(--fd-color-text-muted); }
  .s-pg { gap: 16px; }
  .s-pg i { width: 96px; height: 56px; border-radius: 8px; background: var(--fd-color-surface-sunken); flex: none; }
  .s-pg span:nth-child(2) { flex: 1; } .s-pg small { display: block; font-size: 13px; color: var(--fd-color-text-muted); }
  .s-st { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; white-space: nowrap; }
  .s-det { display: grid; grid-template-columns: 1fr auto; gap: 10px 32px; max-width: 420px; font-size: 14px; }
  .s-det span:nth-child(even) { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  .s-foot { display: flex; align-items: center; gap: 8px; } .s-foot span { flex: 1; font-size: 13px; color: var(--fd-color-text-muted); }
  /* Éditeur */
  .s-ed { display: grid; grid-template-columns: minmax(0, 1fr) 360px; height: 760px; }
  .s-canvas { background: var(--fd-color-surface-sunken); display: grid; place-items: center; }
  .s-canvas i { width: 70%; height: 56%; border-radius: 12px; background: var(--fd-color-surface); box-shadow: 0 8px 32px rgb(8 10 14 / .1); }
  .s-panel { background: var(--fd-color-surface); padding: 24px; display: flex; flex-direction: column; gap: 24px; overflow: hidden; }
  .s-panel h3 { margin: 0 0 4px; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; color: var(--fd-color-text-muted); }
  .s-lk { gap: 12px; min-height: 60px !important; }
  .s-lk span:first-child { flex: 1; min-width: 0; } .s-lk b { display: block; font-size: 14px; font-weight: 600; }
  .s-lk small { display: block; font-size: 12.5px; color: var(--fd-color-text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .u2-ph .s-pg i { display: none; } .u2-ph .s-st { width: 100%; }
  .s-link { all: unset; cursor: pointer; font-size: 14px; font-weight: 600; color: var(--fd-color-primary); }
</style>
</head>
<body>
<main class="u2">
  <header class="u2-head"><div><small>Lot L49 · Reprise UI</small><h1>Sécurité des captures HTML</h1><p>Un réglage clair pour les admins, un compte rendu en une phrase après chaque capture, les liens externes réglés un par un. Le détail reste à un clic.</p></div></header>
  <div id="s1"></div>
  <div id="s2"></div>
  <div id="s3"></div>
  <section class="u2-sec" id="s4"><h2>En sombre et sur mobile</h2><div class="u2-row" data-slot="d"></div></section>
</main>
<script>
  const { I, app, pair } = U2;
  const snav = `<nav class="s-snav" aria-label="Sections des paramètres"><b>Espace</b><a href="#">Général</a><a href="#">Équipe</a><a href="#">Utilisation</a><a href="#" aria-current="page">Sécurité</a><a href="#">Confidentialité</a><b>Marque</b><a href="#">Thème et couleurs</a><a href="#">Page publique</a><b>Contenu</b><a href="#">Variables</a><a href="#">Glossaire</a><b>Connexions</b><a href="#">Intégrations</a></nav>`;
  const settings = (mode = 'dom') => `<div class="s-set">${snav}<div style="display:flex;flex-direction:column;gap:24px;min-width:0">
    <div class="u2-top"><div style="flex:1"><p class="u2-crumb">Paramètres › Espace</p><h1>Sécurité</h1></div><button class="fd-btn fd-btn--primary" type="button">Enregistrer</button></div>
    <section class="u2-card"><div class="u2-setrow"><div><h4>Captures HTML</h4><p>Une capture HTML copie la structure des pages ; une capture d’écran ne copie qu’une image.</p><p style="margin-top:12px">Capturez uniquement des logiciels que vous êtes autorisé à reproduire.</p></div>
      <fieldset class="u2-radio"><legend class="sr-only">Captures HTML</legend>
        <label><input type="radio" name="m${mode}" ${mode === 'all' ? 'checked' : ''}><span>Autorisées partout</span></label>
        <label><input type="radio" name="m${mode}" ${mode === 'dom' ? 'checked' : ''}><span>Seulement sur certains domaines</span></label>
        ${mode === 'dom' ? `<div class="s-doms"><div class="s-chips"><span class="s-chip">app.example.com<button type="button" aria-label="Retirer app.example.com">${I('x', 16)}</button></span><span class="s-chip">*.intranet.example<button type="button" aria-label="Retirer *.intranet.example">${I('x', 16)}</button></span></div><div class="s-add"><label class="sr-only" for="d${mode}">Ajouter un domaine</label><input id="d${mode}" class="fd-input" placeholder="Ajouter un domaine"><button class="fd-btn" type="button">Ajouter</button></div></div>` : ''}
        <label><input type="radio" name="m${mode}" ${mode === 'off' ? 'checked' : ''}><span>Désactivées<small>Captures d’écran uniquement</small></span></label>
      </fieldset></div>
      <div class="u2-setrow s-ghost"><div><h4>Modes d’accès autorisés</h4><p>Les modes que les membres peuvent choisir dans Partager.</p></div><div class="u2-s">Toute personne avec le lien, mot de passe, invitation, domaine e-mail</div></div>
    </section></div></div>`;
  document.getElementById('s1').outerHTML = pair('Paramètres › Sécurité : un réglage, trois choix', app('settings', settings()), 'img/avant/l49-securite.png', 'Page Sécurité actuelle, sans réglage des captures HTML', 'Même disposition que les autres réglages : libellé à gauche, choix à droite. Le badge « Admins » disparaît : le réglage est en lecture seule pour les autres rôles.');
  const pg = (t, u, st) => `<li class="s-pg"><i aria-hidden="true"></i><span><b style="font-weight:600">${t}</b><small>${u}</small></span><span class="s-st">${st === 'ok' ? `<span class="u2-dot u2-ok"></span>Rien à retirer` : st === 'bad' ? `<span class="u2-dot u2-bad"></span>1 lien dangereux bloqué` : `<span class="u2-dot u2-warn"></span>Éléments retirés`}</span></li>`;
  const extScreen = (open) => `<div class="s-ext"><div><h1 style="margin:0;font-size:28px">Vérifiez avant l’envoi</h1></div>
    <div class="s-sum">${I('shield', 22)}<div><b>3 pages nettoyées</b><span>18 éléments actifs retirés, 1 lien dangereux bloqué. Les pages sont publiables.</span><br><button class="s-link" type="button" aria-expanded="${open}" style="margin-top:8px">${open ? 'Masquer le détail' : 'Voir le détail'}</button></div></div>
    ${open ? `<div class="s-det" role="group" aria-label="Détail de l’analyse"><span>Scripts</span><span>3</span><span>Actions au clic</span><span>12</span><span>Cadres intégrés</span><span>2</span><span>Formulaires neutralisés</span><span>1</span><span>Liens externes désactivés</span><span>4</span><span>Liens dangereux bloqués (Google Safe Browsing)</span><span>1</span><span>Données personnelles remplacées</span><span>6</span></div>` : ''}
    <section class="u2-card" style="padding:8px 24px"><ul class="u2-list">${pg('Accueil', 'app.example.com', 'warn')}${pg('Usagers', 'app.example.com/usagers', 'bad')}${pg('Aide', 'app.example.com/aide', 'ok')}</ul></section>
    <div class="s-foot"><span>Rien n’est envoyé avant « Envoyer ».</span><button class="fd-btn fd-btn--ghost" type="button">Supprimer</button><button class="fd-btn fd-btn--primary" type="button">Envoyer 3 pages</button></div></div>`;
  document.getElementById('s2').outerHTML = `<section class="u2-sec"><h2>Extension : le compte rendu tient en une phrase</h2><p>Le chiffre clé d’abord ; le détail se déplie. Un point de couleur et un texte par page, sans badge.</p><div class="u2-row">${app('', extScreen(false), { bare: true, h: 620 }).replace('class="u2-app', 'style="width:700px" class="u2-app')}${app('', extScreen(true), { bare: true, h: 620 }).replace('class="u2-app', 'style="width:700px" class="u2-app')}</div></section>`;
  const lk = (t, u, s) => `<li class="s-lk"><span><b>${t}</b><small>${u}</small></span>${s === 'bad' ? `<span class="s-st u2-bad" style="font-size:13px;font-weight:600">${I('alert', 16)}Bloqué, site signalé</span>` : `<span class="u2-tg${s === 'on' ? ' on' : ''}" role="switch" aria-checked="${s === 'on'}" aria-label="Autoriser ${t}" tabindex="0"></span>`}</li>`;
  const editor = `<div class="s-ed"><div class="s-canvas"><div class="u2-fake" aria-hidden="true"><div><i style="width:40%"></i><i style="width:70%"></i><i style="width:55%"></i></div></div></div><aside class="s-panel" aria-label="Réglages de la page">
    <div><h3>Sécurité de la page</h3><p style="margin:0;font-size:15px"><span class="u2-dot u2-warn" style="margin-right:8px"></span>Éléments retirés · <button class="s-link" type="button">Détail</button></p></div>
    <div><h3>Liens externes</h3><p class="u2-s" style="margin:0 0 4px">Désactivés par défaut. Un lien autorisé s’ouvre après un avertissement.</p>
      <ul class="u2-list">${lk('Documentation', 'docs.example.com/guide', 'on')}${lk('Support', 'support.example.net', 'off')}${lk('Mentions légales', 'example.org/mentions', 'off')}${lk('Offre exceptionnelle', 'promo-gratuite.example', 'bad')}</ul></div></aside></div>`;
  document.getElementById('s3').outerHTML = pair('Éditeur : sécurité en une ligne, liens en liste', app('', editor, { bare: true, h: 760 }), 'img/avant/l46-editeur.png', 'Panneau de l’éditeur actuel, sans section de sécurité', 'Un interrupteur par lien ; un lien signalé affiche son état en texte rouge, sans interrupteur.');
  document.querySelector('[data-slot="d"]').innerHTML = `<div style="flex:1;min-width:900px">${app('settings', settings('off'), { theme: 'dark', h: 620 })}</div><div class="u2-ph">${extScreen(false).replace('width: 760px', '')}</div>`;
</script>
</body>
</html>
