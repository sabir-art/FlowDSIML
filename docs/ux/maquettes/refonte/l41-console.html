<!doctype html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Console propriétaire (lot L41) — TutoClick</title>
<link rel="icon" href="../../brand-tutoclic/production/favicon.svg">
<link rel="stylesheet" href="refonte.css">
<script src="refonte.js" defer></script>
<style>
  /* Maquette cliquable L41 : parcours complet de la Console propriétaire. Données fictives, sans backend.
     Composants du design system (fd-btn, fd-card, fd-segmented, fd-input, fd-badge, fd-table) ; barres de liste selon L40. */
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  body { background: var(--fd-color-bg); }
  .ic { width: 18px; height: 18px; flex: none; }
  .ic-sm { width: 16px; height: 16px; flex: none; }
  [hidden] { display: none !important; }

  /* --- Connexion --- */
  .login { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
  .login__card { width: 420px; max-width: 100%; padding: 40px; display: flex; flex-direction: column; gap: 20px; }
  .login__card img { height: 44px; align-self: flex-start; }
  .login__card h1 { margin: 0; font-size: 26px; }
  .login__card p { margin: 0; color: var(--fd-color-text-muted); }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label, .field .lbl { font-weight: 600; font-size: var(--fd-text-label-size); }
  .field .help { font-size: 13px; color: var(--fd-color-text-muted); }

  /* --- Menu du compte (app client) --- */
  .acct-menu { position: fixed; left: 16px; bottom: 96px; width: 260px; padding: 6px; background: var(--fd-color-surface-raised, var(--fd-color-surface)); border: 1px solid var(--fd-color-border); border-radius: var(--fd-radius-lg); box-shadow: var(--fd-shadow-lg); z-index: 40; }
  .acct-menu button { all: unset; box-sizing: border-box; display: flex; align-items: center; gap: 10px; width: 100%; height: 40px; padding: 0 12px; border-radius: var(--fd-radius-md); cursor: pointer; font: 500 var(--fd-text-label-size) var(--fd-font-sans); color: var(--fd-color-text); }
  .acct-menu button:hover, .acct-menu button:focus-visible { background: var(--fd-color-surface-hover); }
  .acct-menu hr { border: 0; border-top: 1px solid var(--fd-color-border); margin: 6px 0; }
  .acct-menu .sep-label { padding: 6px 12px 2px; font-size: 11px; font-weight: 700; color: var(--fd-color-text-subtle, var(--fd-color-text-muted)); text-transform: uppercase; letter-spacing: .04em; }
  .newdot { width: 8px; height: 8px; border-radius: 50%; background: var(--fd-color-primary); margin-left: auto; }
  .avatar-wrap { position: relative; }
  .avatar-wrap .newdot { position: absolute; right: -1px; top: -1px; margin: 0; box-shadow: 0 0 0 2px var(--fd-color-bg); }
  .menu-active { outline: none; }

  /* --- Console : cadre --- */
  .cs { min-height: 100vh; display: flex; flex-direction: column; }
  .cs-head { display: flex; align-items: center; gap: 24px; padding: 0 32px; height: 72px; background: var(--fd-color-surface); border-bottom: 1px solid var(--fd-color-border); position: sticky; top: 0; z-index: 20; }
  .cs-brand { display: flex; align-items: center; gap: 12px; }
  .cs-brand img { height: 32px; }
  .cs-brand b { font-size: 15px; }
  .cs-brand small { display: block; color: var(--fd-color-text-muted); font-size: 12px; }
  .cs-tabs { display: flex; gap: 4px; height: 100%; }
  .cs-tabs button { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; padding: 0 14px; height: 100%; font: 600 var(--fd-text-label-size) var(--fd-font-sans); color: var(--fd-color-text-muted); box-shadow: inset 0 -2px 0 transparent; }
  .cs-tabs button[aria-selected='true'] { color: var(--fd-color-text); box-shadow: inset 0 -2px 0 var(--fd-color-primary); }
  .cs-tabs button:focus-visible { box-shadow: var(--fd-shadow-focus); border-radius: 6px; }
  .cnt { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--fd-color-surface-sunken); color: var(--fd-color-text); font-size: 12px; font-weight: 700; }
  .cs-head__end { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  .role-badge { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 999px; background: var(--fd-color-primary-soft); color: var(--fd-color-primary-soft-text); font-size: 12px; font-weight: 700; }
  .role-badge--ro { background: var(--fd-color-surface-sunken); color: var(--fd-color-text-muted); }
  .cs-main { flex: 1; width: 100%; max-width: 1280px; margin: 0 auto; padding: 32px; display: flex; flex-direction: column; gap: 24px; }
  .page-t { display: flex; align-items: flex-start; gap: 16px; }
  .page-t h1 { margin: 0; font-size: 28px; }
  .page-t p { margin: 4px 0 0; color: var(--fd-color-text-muted); }
  .page-t .end { margin-left: auto; display: flex; gap: 8px; }
  .ro-note { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: var(--fd-radius-md); background: var(--fd-color-surface-sunken); border: 1px solid var(--fd-color-border); color: var(--fd-color-text-muted); font-size: 14px; }

  /* --- Barres L40 --- */
  .fd-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px; }
  .fd-toolbar__group { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .fd-toolbar__group--end { margin-left: auto; }
  .fd-toolbar .fd-btn { height: 40px; }
  .fd-toolbar .fd-segmented { padding: 3px; }
  .fd-toolbar .fd-segmented > button { height: 32px; padding: 0 12px; }
  .fd-filter { padding: 0 12px 0 16px; gap: 8px; }
  .fd-filter .lab { color: var(--fd-color-text-muted); font-weight: 500; }

  /* --- Vue d'ensemble --- */
  .kpis4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .kpi { padding: 20px; display: flex; flex-direction: column; gap: 8px; }
  .kpi .l { display: flex; align-items: center; gap: 8px; color: var(--fd-color-text-muted); font-weight: 600; font-size: 14px; }
  .kpi .v { font-size: 36px; font-weight: 800; letter-spacing: -.02em; }
  .kpi .f { color: var(--fd-color-text-muted); font-size: 13px; }
  .twocol { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; }
  .card-pad { padding: 24px; display: flex; flex-direction: column; gap: 16px; }
  .card-pad h2 { margin: 0; font-size: 18px; }
  .card-pad .sub { margin: -8px 0 0; color: var(--fd-color-text-muted); font-size: 14px; }
  .prob { display: grid; grid-template-columns: 1fr 120px auto; gap: 16px; align-items: center; padding: 14px 0; border-top: 1px solid var(--fd-color-border); }
  .prob:first-of-type { border-top: 0; }
  .prob b { display: block; }
  .prob small { color: var(--fd-color-text-muted); }
  .sat { display: flex; flex-direction: column; gap: 6px; font-weight: 700; font-size: 14px; }
  .bar { height: 6px; border-radius: 999px; background: var(--fd-color-surface-sunken); overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--fd-color-primary); }
  .act { display: flex; flex-direction: column; }
  .act li { list-style: none; display: grid; grid-template-columns: 28px 1fr; gap: 10px; padding: 10px 0; border-top: 1px solid var(--fd-color-border); font-size: 14px; }
  .act li:first-child { border-top: 0; }
  .act small { display: block; color: var(--fd-color-text-muted); }
  .act ul { margin: 0; padding: 0; }
  .ava { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--fd-color-primary-soft); color: var(--fd-color-primary-soft-text); font-size: 11px; font-weight: 700; }

  /* --- Retours --- */
  .cmt { padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  .cmt__meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; font-size: 13px; color: var(--fd-color-text-muted); }
  .cmt__meta a { color: var(--fd-color-text); font-weight: 600; }
  .cmt__txt { margin: 0; font-size: 15px; line-height: 1.5; }
  .cmt__foot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .cmt__foot .end { margin-left: auto; display: flex; gap: 8px; }
  .st { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 700; }
  .st svg { width: 14px; height: 14px; }
  .st--new { background: var(--fd-color-info-soft, var(--fd-color-surface-sunken)); color: var(--fd-color-text); }
  .st--linked { background: var(--fd-color-primary-soft); color: var(--fd-color-primary-soft-text); }
  .st--arch { background: var(--fd-color-surface-sunken); color: var(--fd-color-text-muted); }
  .list { display: flex; flex-direction: column; gap: 12px; }
  .tbl-card { padding: 8px 8px 4px; overflow-x: auto; }
  .fd-table td small { display: block; color: var(--fd-color-text-muted); }
  .num { font-variant-numeric: tabular-nums; }

  /* --- Popover « Rattacher à… » --- */
  .pop { position: absolute; z-index: 50; width: 360px; padding: 8px; background: var(--fd-color-surface-raised, var(--fd-color-surface)); border: 1px solid var(--fd-color-border); border-radius: var(--fd-radius-lg); box-shadow: var(--fd-shadow-lg); }
  .pop .fd-input { width: 100%; height: 40px; margin-bottom: 6px; }
  .pop button.opt { all: unset; box-sizing: border-box; display: flex; flex-direction: column; gap: 2px; width: 100%; padding: 10px 12px; border-radius: var(--fd-radius-md); cursor: pointer; }
  .pop button.opt:hover, .pop button.opt:focus-visible { background: var(--fd-color-surface-hover); }
  .pop button.opt small { color: var(--fd-color-text-muted); font-size: 12px; }

  /* --- Backlog en colonnes --- */
  .kb { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; align-items: start; }
  .kb-col { display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: var(--fd-radius-lg); background: var(--fd-color-surface-sunken); border: 1px solid var(--fd-color-border); min-height: 360px; }
  .kb-col h2 { margin: 0; padding: 4px 4px 6px; display: flex; align-items: center; gap: 8px; font-size: 14px; }
  .kb-col h2 .cnt { background: var(--fd-color-surface); }
  .kb-card { all: unset; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: var(--fd-radius-md); background: var(--fd-color-surface); border: 1px solid var(--fd-color-border); box-shadow: var(--fd-shadow-xs); cursor: pointer; }
  .kb-card:hover { border-color: var(--fd-color-border-strong); }
  .kb-card:focus-visible { box-shadow: var(--fd-shadow-focus); }
  .kb-card[data-new='true'] { border-color: var(--fd-color-primary); }
  .kb-card b { font-size: 14px; line-height: 1.35; }
  .kb-card .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: var(--fd-color-text-muted); }
  .chip { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 999px; background: var(--fd-color-surface-sunken); color: var(--fd-color-text-muted); font-size: 12px; font-weight: 600; }
  .chip svg { width: 13px; height: 13px; }
  .prio { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid var(--fd-color-border); }
  .prio--haute { background: var(--fd-color-danger-soft, var(--fd-color-primary-soft)); color: var(--fd-color-text); }
  .rejected { padding: 16px 20px; display: flex; flex-direction: column; gap: 8px; }
  .rejected summary { cursor: pointer; font-weight: 600; }
  .rejected p { margin: 0; color: var(--fd-color-text-muted); font-size: 14px; }

  /* --- Tiroir (fiche d'élément) --- */
  .scrim { position: fixed; inset: 0; background: rgba(8, 10, 14, .38); z-index: 60; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 560px; max-width: 100%; background: var(--fd-color-surface); border-left: 1px solid var(--fd-color-border); box-shadow: var(--fd-shadow-lg); z-index: 61; display: flex; flex-direction: column; }
  .drawer__head { display: flex; align-items: center; gap: 12px; padding: 20px 24px; border-bottom: 1px solid var(--fd-color-border); }
  .drawer__head h2 { margin: 0; font-size: 18px; flex: 1; }
  .drawer__body { flex: 1; overflow: auto; padding: 24px; display: flex; flex-direction: column; gap: 20px; }
  .move { display: flex; flex-wrap: wrap; gap: 8px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .fd-input, .fd-select { width: 100%; }
  textarea.fd-input { height: auto; min-height: 84px; padding: 10px 12px; resize: vertical; font: inherit; }
  .linked { display: flex; flex-direction: column; gap: 8px; }
  .linked li { list-style: none; padding: 12px 14px; border-radius: var(--fd-radius-md); background: var(--fd-color-surface-sunken); font-size: 14px; }
  .linked li small { display: block; color: var(--fd-color-text-muted); margin-bottom: 4px; }
  .linked ul { margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .hist { margin: 0; padding: 0; font-size: 13px; color: var(--fd-color-text-muted); display: flex; flex-direction: column; gap: 6px; }
  .hist li { list-style: none; }
  .saved { font-size: 13px; color: var(--fd-color-text-muted); display: inline-flex; align-items: center; gap: 6px; }

  /* --- Modales --- */
  .modal { position: fixed; z-index: 70; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 560px; max-width: calc(100vw - 32px); max-height: calc(100vh - 48px); overflow: auto; background: var(--fd-color-surface); border: 1px solid var(--fd-color-border); border-radius: 16px; box-shadow: var(--fd-shadow-lg); padding: 28px; display: flex; flex-direction: column; gap: 18px; }
  .modal h2 { margin: 0; font-size: 20px; }
  .modal p { margin: 0; color: var(--fd-color-text-muted); }
  .modal .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
  .modal--wide { width: 880px; }
  .compose { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .preview-lab { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--fd-color-text-muted); }

  /* --- Nouveautés --- */
  .news { padding: 24px; display: flex; flex-direction: column; gap: 10px; }
  .news__date { font-size: 13px; color: var(--fd-color-text-muted); display: flex; align-items: center; gap: 8px; }
  .news h3 { margin: 0; font-size: 18px; }
  .news p { margin: 0; line-height: 1.55; }
  .news a { font-weight: 600; color: var(--fd-color-primary); display: inline-flex; align-items: center; gap: 6px; }
  .news__foot { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .news__foot .end { margin-left: auto; display: flex; gap: 8px; }
  .tag-new { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 999px; background: var(--fd-color-primary-soft); color: var(--fd-color-primary-soft-text); font-size: 12px; font-weight: 700; }

  /* --- Équipe et journal --- */
  .two { display: grid; grid-template-columns: 1fr; gap: 24px; }
  .fd-table select.fd-select { width: 160px; height: 36px; }

  /* --- Toast --- */
  .toast-l41 { position: fixed; right: 24px; bottom: 24px; z-index: 80; display: flex; align-items: center; gap: 12px; min-width: 320px; padding: 12px 16px; background: var(--fd-color-surface-raised, var(--fd-color-surface)); border: 1px solid var(--fd-color-border); border-radius: var(--fd-radius-lg); box-shadow: var(--fd-shadow-md); font-size: 14px; }
  .toast-l41 svg { color: var(--fd-color-success); }

  /* --- Barre de la maquette (hors produit) --- */
  .mockbar { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 90; display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 14px; border-radius: 999px; background: #12161B; color: #fff; font: 600 12px var(--fd-font-sans); box-shadow: var(--fd-shadow-lg); }
  .mockbar button { all: unset; cursor: pointer; padding: 6px 10px; border-radius: 999px; }
  .mockbar button:hover, .mockbar button[aria-pressed='true'] { background: rgba(255,255,255,.16); }
  .mockbar .step { opacity: .8; }
  @media print { .mockbar { display: none; } }
</style>
</head>
<body>
<div id="root"></div>
<div class="mockbar" role="region" aria-label="Commandes de la maquette (hors produit)">
  <span class="step" id="mk-step">Étape 1</span>
  <button type="button" data-mk="prev">Précédent</button>
  <button type="button" data-mk="next">Suivant</button>
  <button type="button" data-mk="ro" aria-pressed="false">Lecture seule</button>
  <button type="button" data-mk="theme">Sombre</button>
  <button type="button" data-mk="reset">Recommencer</button>
</div>

/* Icônes : tracés Lucide (licence ISC). */

  logout: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/>',

/* ---------- Rendu et parcours ---------- */
function render() {
  const r = document.getElementById('root');
  r.innerHTML = S.screen === 'login' ? vLogin() : S.screen === 'app' ? vApp() : S.screen === 'client-news' ? vApp('news') : vConsole();
  document.documentElement.dataset.theme = S.theme;
  document.getElementById('mk-step').textContent = 'Étape ' + (stepIndex() + 1) + ' · ' + STEPS[stepIndex()];
  document.querySelector('[data-mk="ro"]').setAttribute('aria-pressed', String(S.readonly));
  document.querySelector('[data-mk="theme"]').textContent = S.theme === 'light' ? 'Sombre' : 'Clair';
  if (S.toast) { const t = S.toast; setTimeout(() => { if (S.toast === t) { S.toast = null; render(); } }, 3200); }
}
let STEP = 0;
function stepIndex() { return STEP; }
const go = {
  login() { S.screen = 'app'; S.menu = false; STEP = 1; },
  menu() { S.menu = !S.menu; STEP = 1; },
  console() { S.screen = 'console'; S.menu = false; S.tab = 'apercu'; log('Connexion à la console', '—'); STEP = 2; }
};
function stepTo(n) {
  S = initial(); S.theme = document.documentElement.dataset.theme || 'light'; STEP = 0;
  const seq = [
    () => {},
    () => { S.screen = 'app'; S.menu = true; },
    () => { go.console(); },
    () => { S.tab = 'retours'; S.sub = 'comments'; },
    () => { S.modal = { kind: 'create', c: 'c1' }; },
    () => { doCreate(); S.modal = null; S.toast = null; S.pop = { c: 'c2', x: 560, y: 540 }; },
    () => { attachTo('b6'); S.pop = null; S.toast = null; S.tab = 'backlog'; },
    () => { S.drawer = 'b6'; setStatus('planned'); setStatus('progress'); setStatus('done'); S.modal = null; },
    () => { S.modal = { kind: 'announce', i: 'b6' }; },
    () => { S.modal = null; S.drawer = null; publish(); S.tab = 'news'; S.toast = null; },
    () => { S.tab = 'team'; },
    () => { S.screen = 'app'; S.menu = true; },
    () => { S.screen = 'client-news'; S.menu = false; S.seenNews = true; }
  ];
  for (let k = 0; k <= n; k++) { seq[k](); STEP = k; }
  render();
}
function doCreate() {
  const c = S.comments.find((x) => x.id === 'c1');
  const t = (document.getElementById('mc-title') || {}).value || 'Export SCORM : rendre visible le choix de la version (1.2 ou 2004)';
  S.items.push({ id: 'b6', title: t, status: 'triage', prio: 'Moyenne', article: c.article, gh: 'https://github.com/tutoclick-exemple/app/issues/431', count: 1, note: '', hist: ['20 nov. · Créé par Léa Fictive depuis un retour'], fresh: true });
  c.status = 'linked'; c.item = 'b6';
  log('Élément créé depuis un retour', t); toast('Élément créé dans « À trier ». Le commentaire y est rattaché.');
}
function attachTo(id) {
  const c = S.comments.find((x) => x.id === (S.pop ? S.pop.c : 'c2'));
  const i = S.items.find((x) => x.id === id) || S.items.find((x) => x.id === 'b6');
  c.status = 'linked'; c.item = i.id; i.count += 1;
  log('Retour rattaché', i.title); toast(`Commentaire rattaché à « ${i.title} » (${i.count} retours).`);
}
function setStatus(k) {
  const i = S.items.find((x) => x.id === S.drawer);
  if (i.status === k) return;
  const from = STATUS[i.status][0];
  i.status = k; i.hist.push(`20 nov. · ${STATUS[k][0]} par Léa Fictive`);
  log(`Statut modifié : ${from} → ${STATUS[k][0]}`, i.title);
  if (k === 'done' && !i.announced) S.modal = { kind: 'announce', i: i.id };
}
function publish(draft) {
  const i = S.items.find((x) => x.id === 'b6');
  S.news.forEach((n) => (n.fresh = false));
  S.news.unshift({ id: 'n2', title: 'Export SCORM : choisissez la version 1.2 ou 2004', text: 'Dans Diffuser > Plateforme de formation, la version du paquet SCORM se choisit maintenant avant le téléchargement. L’article d’aide explique laquelle prendre selon votre plateforme.', article: i.article, date: '20 nov. 2026', state: draft ? 'draft' : 'published', fresh: !draft, item: 'b6' });
  if (!draft) { i.announced = true; log('Nouveauté publiée', 'Export SCORM : choisissez la version 1.2 ou 2004'); toast('Annonce publiée. Les clients voient un point sur « Nouveautés ».'); }
  else { log('Brouillon d’annonce enregistré', i.title); toast('Brouillon enregistré.'); }
}

document.addEventListener('submit', (e) => {
  e.preventDefault();
  const a = e.target.dataset.act;
  if (a === 'login') go.login();
  if (a === 'do-create') { doCreate(); S.modal = null; STEP = 5; }
  if (a === 'publish') { publish(); S.modal = null; S.drawer = null; S.tab = 'news'; STEP = 9; }
  render();
});
document.addEventListener('click', (e) => {
  const mk = e.target.closest('[data-mk]');
  if (mk) {
    const k = mk.dataset.mk;
    if (k === 'next') stepTo(Math.min(STEP + 1, STEPS.length - 1));
    if (k === 'prev') stepTo(Math.max(STEP - 1, 0));
    if (k === 'reset') stepTo(0);
    if (k === 'ro') { S.readonly = !S.readonly; render(); }
    if (k === 'theme') { S.theme = S.theme === 'light' ? 'dark' : 'light'; render(); }
    return;
  }
  const t = e.target.closest('[data-act],[data-tab],[data-sub],[data-ntab]');
  if (!t) { if (S.menu && !e.target.closest('.acct-menu')) { S.menu = false; render(); } if (S.pop && !e.target.closest('.pop')) { S.pop = null; render(); } return; }
  if (t.dataset.tab) { S.tab = t.dataset.tab; S.pop = null; STEP = { apercu: 2, retours: 3, backlog: 6, news: 9, team: 10 }[S.tab]; render(); return; }
  if (t.dataset.sub) { S.sub = t.dataset.sub; render(); return; }
  if (t.dataset.ntab) { S.newsTab = t.dataset.ntab; render(); return; }
  const a = t.dataset.act;
  if (t.tagName === 'A') e.preventDefault();
  if (t.disabled) return;
  switch (a) {
    case 'menu': go.menu(); break;
    case 'console': go.console(); break;
    case 'logout': S = initial(); STEP = 0; break;
    case 'home': S.screen = 'app'; S.menu = false; break;
    case 'back-app': S.screen = 'app'; S.menu = false; break;
    case 'news-client': S.screen = 'client-news'; S.menu = false; S.seenNews = true; STEP = 12; break;
    case 'see-client': S.screen = 'app'; S.menu = true; STEP = 11; break;
    case 'see-article': S.tab = 'retours'; S.sub = 'comments'; S.filterArticle = t.dataset.a; STEP = 3; break;
    case 'clear-article': S.filterArticle = null; break;
    case 'create': S.modal = { kind: 'create', c: t.dataset.c }; STEP = 4; break;
    case 'close-modal': S.modal = null; break;
    case 'attach': { const r = t.getBoundingClientRect(); S.pop = { c: t.dataset.c, x: Math.max(16, r.right - 360 + window.scrollX), y: r.bottom + 6 + window.scrollY }; STEP = 5; break; }
    case 'attach-to': attachTo(t.dataset.i); S.pop = null; break;
    case 'archive': { const c = S.comments.find((x) => x.id === t.dataset.c); c.status = 'archived'; log('Retour classé sans suite', c.article); toast('Commentaire classé.'); break; }
    case 'open': S.drawer = t.dataset.i; STEP = 7; break;
    case 'close': S.drawer = null; break;
    case 'status': setStatus(t.dataset.s); if (S.modal) STEP = 8; break;
    case 'compose': S.modal = { kind: 'compose', i: S.modal.i }; break;
    case 'compose-free': S.modal = { kind: 'compose', i: 'b6' }; break;
    case 'draft': publish(true); S.modal = null; S.drawer = null; S.tab = 'news'; S.newsTab = 'draft'; break;
    case 'new-item': S.modal = { kind: 'create', c: 'c3' }; break;
    case 'add-owner': toast('Saisissez l’adresse d’un compte TutoClick existant, puis choisissez son rôle.'); break;
  }
  render();
});
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (S.modal) S.modal = null; else if (S.pop) S.pop = null; else if (S.drawer) S.drawer = null; else if (S.menu) S.menu = false; else return;
  render();
});
document.addEventListener('DOMContentLoaded', () => {
  const q = new URLSearchParams(location.search);
  if (q.get('theme')) S.theme = q.get('theme');
  const st = parseInt(q.get('step') || '0', 10);
  stepTo(isNaN(st) ? 0 : st - 1 < 0 ? 0 : st - 1);
  if (q.get('ro') === '1') { S.readonly = true; render(); }
});
</script>
