<!doctype html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Utilisation de l'espace (lot L48-A) — TutoClick</title>
<link rel="icon" href="../../brand-tutoclic/production/favicon.svg">
<link rel="stylesheet" href="refonte.css">
<link rel="stylesheet" href="ui2.css">
<script src="ui2.js"></script>
<style>
  /* L48-A §6, reprise UI (composants §17). Données fictives. */
  .q-wrap { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 40px; }
  .q-snav { display: flex; flex-direction: column; gap: 2px; padding-top: 4px; }
  .q-snav b { margin: 16px 12px 6px; font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--fd-color-text-muted); } .q-snav b:first-child { margin-top: 0; }
  .q-snav a { display: flex; align-items: center; height: 36px; padding: 0 12px; border-radius: 10px; font-size: 14px; color: var(--fd-color-text); text-decoration: none; }
  .q-snav a[aria-current] { background: var(--fd-color-surface); font-weight: 600; }
  .q-row { display: grid; grid-template-columns: 220px minmax(0, 1fr) 180px; gap: 32px; align-items: center; padding: 22px 0; border-top: 1px solid var(--fd-color-border); }
  .q-row:first-child { border-top: 0; }
  .q-row b { font-size: 15px; font-weight: 600; } .q-row small { display: block; font-size: 13px; color: var(--fd-color-text-muted); margin-top: 2px; }
  .q-bar { height: 6px; border-radius: 999px; background: var(--fd-color-surface-sunken); overflow: hidden; } .q-bar i { display: block; height: 100%; border-radius: 999px; background: var(--fd-color-text); }
  .q-row.warn .q-bar i { background: var(--fd-color-warning, #b26b00); } .q-row.full .q-bar i { background: var(--fd-color-danger, #b4234b); }
  .q-val { text-align: right; font-size: 15px; font-variant-numeric: tabular-nums; } .q-val small { margin-top: 2px; }
  .q-val .st { font-size: 13px; font-weight: 600; }
  .u2-ph .q-row { grid-template-columns: 1fr auto; gap: 8px 16px; } .u2-ph .q-bar { grid-column: 1 / -1; grid-row: 2; }
</style>
</head>
<body>
<main class="u2">
  <header class="u2-head"><div><small>Lot L48-A · Reprise UI</small><h1>Utilisation de l’espace</h1><p>Une ligne par quota : le nom, une barre fine, le chiffre. L’état n’apparaît que lorsqu’il compte, à partir de 80 %.</p></div></header>
  <div id="a1"></div>
  <section class="u2-sec"><h2>En sombre et sur mobile</h2><div class="u2-row" id="a2"></div></section>
</main>
<script>
  const { I, app, pair } = U2;
  const Q = [
    ['Assistance IA', 'Remise à zéro le 1er décembre', 82, '412 / 500 requêtes', 'warn'],
    ['Voix off et sous-titres', 'Remise à zéro le 1er décembre', 30, '18 / 60 min', ''],
    ['Stockage', 'Médiathèque 312 Mo · vidéos 164 Mo · voix 24 Mo', 100, '500 / 500 Mo', 'full'],
    ['Membres', 'Les apprenants ne comptent pas', 72, '18 / 25', ''],
    ['Démos publiées', 'Les brouillons ne comptent pas', null, '24 · sans limite', ''],
    ['Conservation des statistiques', 'Les visites plus anciennes sont supprimées', null, '24 mois', '']
  ];
  const rows = (mob) => Q.map(([n, h, p, v, st]) => `<div class="q-row ${st}"><span><b>${n}</b>${mob ? '' : `<small>${h}</small>`}</span>${p === null ? (mob ? '' : '<span></span>') : `<div class="q-bar" role="meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${p}" aria-label="${n} : ${p} % utilisés"><i style="width:${p}%"></i></div>`}<span class="q-val">${v}${st ? `<small class="st ${st === 'full' ? 'u2-bad' : 'u2-warn'}">${st === 'full' ? 'Limite atteinte' : 'Bientôt atteinte'}</small>` : ''}</span></div>`).join('');
  const snav = `<nav class="q-snav" aria-label="Sections des paramètres"><b>Espace</b><a href="#">Général</a><a href="#">Équipe</a><a href="#" aria-current="page">Utilisation</a><a href="#">Sécurité</a><a href="#">Confidentialité</a><b>Marque</b><a href="#">Thème et couleurs</a><a href="#">Page publique</a><b>Contenu</b><a href="#">Variables</a><a href="#">Glossaire</a></nav>`;
  const page = `<div class="q-wrap">${snav}<div style="display:flex;flex-direction:column;gap:24px;min-width:0"><div class="u2-top"><div style="flex:1"><p class="u2-crumb">Paramètres › Espace</p><h1>Utilisation</h1><p>Aucun paiement. Pour aller au-delà d’une limite, demandez à la DSI.</p></div><button class="fd-btn" type="button">Demander plus à la DSI</button></div>
    <section class="u2-card" style="padding:8px 28px">${rows(false)}</section></div></div>`;
  document.getElementById('a1').outerHTML = pair('Paramètres › Utilisation', app('settings', page), 'img/avant/l48-plans.png', 'Plans et facturation actuel, avec les prix', 'Plus de prix ni d’offre. Six lignes au lieu de six cartes ; la couleur n’apparaît que pour un quota proche ou atteint.');
  document.getElementById('a2').innerHTML = `<div style="width:100%">${app('settings', page, { theme: 'dark' })}</div><div class="u2-ph"><div><p class="u2-crumb">Paramètres › Espace</p><h1 style="margin:0;font-size:24px">Utilisation</h1></div><section class="u2-card" style="padding:4px 20px">${rows(true)}</section><button class="fd-btn" type="button">Demander plus à la DSI</button></div>`;
</script>
</body>
</html>
