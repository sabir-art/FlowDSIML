<!doctype html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cartes KPI sélectionnables (lot L47) — TutoClick</title>
<link rel="icon" href="../../brand-tutoclic/production/favicon.svg">
<link rel="stylesheet" href="refonte.css">
<link rel="stylesheet" href="ui2.css">
<script src="ui2.js"></script>
<style>
  /* L47, reprise UI (composants §17). Spec : docs/ux/specs/l47-kpi-vues.md. Données fictives. */
  .k-bar { display: flex; align-items: center; gap: 8px; }
  .k-flt { display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 16px; border-radius: 999px; background: var(--fd-color-surface); font-size: 14px; color: var(--fd-color-text); border: 0; }
  .k-flt span { color: var(--fd-color-text-muted); }
  .k-bar .end { margin-left: auto; }
  .k-card { background: var(--fd-color-surface); border-radius: 20px; overflow: hidden; }
  .k-tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-bottom: 1px solid var(--fd-color-border); }
  .k-tab { all: unset; box-sizing: border-box; position: relative; display: flex; flex-direction: column; gap: 6px; padding: 24px 28px 22px; cursor: pointer; }
  .k-tab + .k-tab { border-left: 1px solid var(--fd-color-border); }
  .k-tab .l { font-size: 14px; color: var(--fd-color-text-muted); }
  .k-tab .v { font-size: 32px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; color: var(--fd-color-text-muted); }
  .k-tab .d { font-size: 13px; color: var(--fd-color-text-muted); }
  .k-tab[aria-selected='true'] .l, .k-tab[aria-selected='true'] .v { color: var(--fd-color-text); }
  .k-tab[aria-selected='true']::after { content: ''; position: absolute; left: 28px; right: 28px; bottom: -1px; height: 3px; border-radius: 3px 3px 0 0; background: var(--fd-color-text); }
  .k-tab:focus-visible { box-shadow: inset var(--fd-shadow-focus); }
  .k-chart { padding: 24px 28px 28px; display: flex; flex-direction: column; gap: 16px; }
  .k-chart header { display: flex; align-items: baseline; gap: 16px; } .k-chart h3 { margin: 0; font-size: 16px; flex: 1; }
  .k-leg { font-size: 13px; color: var(--fd-color-text-muted); display: flex; gap: 16px; } .k-leg i { display: inline-block; width: 14px; border-top: 2px solid var(--fd-color-primary); vertical-align: middle; margin-right: 6px; } .k-leg i.p { border-top: 2px dashed var(--fd-color-text-muted); }
  .k-svg { width: 100%; height: 240px; display: block; }
  .k-tbl { width: 100%; border-collapse: collapse; font-size: 15px; }
  .k-tbl th { text-align: left; font-size: 13px; font-weight: 500; color: var(--fd-color-text-muted); padding: 0 0 12px; }
  .k-tbl td { padding: 14px 0; border-top: 1px solid var(--fd-color-border); }
  .k-tbl .r { text-align: right; font-variant-numeric: tabular-nums; }
  .k-tbl th.on, .k-tbl td.on { color: var(--fd-color-text); font-weight: 700; }
  .k-tbl td:not(.on):not(:first-child) { color: var(--fd-color-text-muted); }
  /* Page Démos : raccourcis */
  .k-short { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--fd-color-surface); border-radius: 20px; }
  .k-sc { position: relative; display: flex; flex-direction: column; gap: 6px; padding: 24px 28px; text-decoration: none; color: var(--fd-color-text); border-radius: 20px; }
  .k-sc + .k-sc::before { content: ''; position: absolute; left: 0; top: 24px; bottom: 24px; border-left: 1px solid var(--fd-color-border); }
  .k-sc .l { font-size: 14px; color: var(--fd-color-text-muted); } .k-sc .v { font-size: 32px; font-weight: 700; font-variant-numeric: tabular-nums; } .k-sc .d { font-size: 13px; color: var(--fd-color-text-muted); }
  .k-sc .go { position: absolute; right: 24px; top: 24px; color: var(--fd-color-primary); opacity: 0; transition: opacity .15s; display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; }
  .k-sc:hover, .k-sc.is-h { background: var(--fd-color-surface-sunken); } .k-sc:hover .go, .k-sc.is-h .go { opacity: 1; }
  .k-rule { width: 100%; max-width: 860px; border-collapse: collapse; font-size: 15px; }
  .k-rule th { text-align: left; font-size: 13px; font-weight: 500; color: var(--fd-color-text-muted); padding: 0 16px 12px 0; }
  .k-rule td { padding: 14px 16px 14px 0; border-top: 1px solid var(--fd-color-border); }
  .k-rule td:nth-child(3) { font-weight: 700; font-variant-numeric: tabular-nums; }
  .u2-ph .k-tabs { display: flex; overflow-x: auto; scrollbar-width: none; } .u2-ph .k-tab { flex: 0 0 150px; padding: 18px 18px 16px; } .u2-ph .k-tab .v { font-size: 24px; } .u2-ph .k-tab[aria-selected='true']::after { left: 18px; right: 18px; }
  .u2-ph .k-chart { padding: 18px; } .u2-ph .k-leg { display: none; }
</style>
</head>
<body>
<main class="u2">
  <header class="u2-head"><div><small>Lot L47 · Reprise UI</small><h1>Indicateurs qui pilotent la vue</h1><p>Quatre indicateurs en onglets dans une seule carte, le graphique juste dessous. L’indicateur actif est souligné, comme un onglet ; les autres restent discrets.</p></div></header>
  <div id="a1"></div>
  <div id="a2"></div>
  <section class="u2-sec"><h2>Évolutions : jamais de pourcentage trompeur</h2><div class="u2-card" id="a3"></div></section>
  <section class="u2-sec"><h2>En sombre et sur mobile</h2><div class="u2-row" id="a4"></div></section>
</main>
<script>
  const { I, app, pair } = U2;
  const KPI = [
    { k: 'views', l: 'Vues', v: '4 812', d: '+12 % vs 30 j précédents', t: 'Vues par jour', s: [120, 140, 132, 160, 151, 170, 182, 165, 190, 204, 198, 215, 230, 221] },
    { k: 'visitors', l: 'Visiteurs', v: '2 960', d: '+8 % vs 30 j précédents', t: 'Visiteurs par jour', s: [80, 90, 86, 100, 96, 108, 112, 104, 118, 124, 120, 130, 138, 132] },
    { k: 'completion', l: 'Taux de complétion', v: '64 %', d: '+5 pts vs 30 j précédents', t: 'Taux de complétion par jour', s: [58, 60, 59, 61, 62, 60, 63, 64, 62, 65, 66, 64, 67, 66] },
    { k: 'leads', l: 'Leads', v: '14', d: '+11 vs 3 les 30 j précédents', t: 'Leads par jour', s: [0, 1, 0, 2, 1, 0, 1, 2, 0, 1, 3, 1, 1, 1] }
  ];
  const DEMOS = [['Créer un rapport', ['1 420', '880', '71 %', '6']], ['Importer des contacts', ['982', '611', '58 %', '4']], ['Configurer un tableau de bord', ['1 105', '702', '66 %', '3']], ['Partager un dossier', ['705', '434', '62 %', '1']]];
  const chart = (s, h = 240) => {
    const W = 1000, H = h, pl = 0, pb = 8, max = Math.max(...s, 1) * 1.2, n = s.length;
    const pt = (v, i) => `${(pl + i / (n - 1) * (W - pl - 8)).toFixed(1)},${(8 + (H - pb - 8) * (1 - v / max)).toFixed(1)}`;
    const prev = s.map((v, i) => v * (0.82 + 0.06 * Math.sin(i)));
    const grid = [0, .5, 1].map((f) => { const y = (8 + (H - pb - 8) * (1 - f)).toFixed(1); return `<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="var(--fd-color-border)" vector-effect="non-scaling-stroke"/>`; }).join('');
    return `<svg class="k-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Courbe sur 14 jours, comparée à la période précédente">${grid}<polyline points="${prev.map(pt).join(' ')}" fill="none" stroke="var(--fd-color-text-muted)" stroke-width="1.5" stroke-dasharray="5 5" vector-effect="non-scaling-stroke"/><polyline points="${s.map(pt).join(' ')}" fill="none" stroke="var(--fd-color-primary)" stroke-width="2.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg><div style="display:flex;justify-content:space-between;font-size:12px;color:var(--fd-color-text-muted)"><span>7 nov.</span><span>20 nov.</span></div>`;
  };
  const tabs = (act, pre) => `<div class="k-tabs" role="tablist" aria-label="Indicateur affiché">${KPI.map((x) => `<button class="k-tab" type="button" role="tab" id="${pre}-${x.k}" aria-selected="${x.k === act}" aria-controls="${pre}-p" tabindex="${x.k === act ? 0 : -1}"><span class="l">${x.l}</span><span class="v">${x.v}</span><span class="d">${x.d}</span></button>`).join('')}</div>`;
  const panel = (act, pre, h) => { const m = KPI.find((x) => x.k === act); return `<div class="k-chart" role="tabpanel" id="${pre}-p" aria-labelledby="${pre}-${act}"><header><h3>${m.t}</h3><span class="k-leg"><span><i></i>14 derniers jours</span><span><i class="p"></i>Période précédente</span></span></header>${chart(m.s, h)}</div>`; };
  const idx = (act) => KPI.findIndex((x) => x.k === act);
  const table = (act) => { const i = idx(act); const rows = [...DEMOS].sort((a, b) => parseFloat(b[1][i].replace(/\D/g, '')) - parseFloat(a[1][i].replace(/\D/g, ''))); return `<section class="u2-card"><h3 style="margin-bottom:16px">Par démo</h3><table class="k-tbl"><thead><tr><th>Démo</th>${KPI.map((x, j) => `<th class="r${j === i ? ' on' : ''}"${j === i ? ' aria-sort="descending"' : ''}>${x.l}</th>`).join('')}</tr></thead><tbody>${rows.map(([n, v]) => `<tr><td>${n}</td>${v.map((c, j) => `<td class="r${j === i ? ' on' : ''}">${c}</td>`).join('')}</tr>`).join('')}</tbody></table></section>`; };
  const page = (act, pre) => `<div class="u2-top"><div style="flex:1"><h1>Analytics</h1></div><button class="fd-btn" type="button">${I('download')}Exporter</button></div>
    <div class="k-bar"><span class="k-flt"><span>Démo :</span>Toutes${I('down', 16)}</span><span class="k-flt"><span>Source :</span>Toutes${I('down', 16)}</span><span class="fd-segmented end" role="group" aria-label="Période"><button type="button" aria-pressed="false">7 j</button><button type="button" aria-pressed="true">30 j</button><button type="button" aria-pressed="false">90 j</button></span></div>
    <section class="k-card">${tabs(act, pre)}${panel(act, pre)}</section>${table(act)}`;
  document.getElementById('a1').outerHTML = pair('Analytics : un indicateur, une courbe, un tableau trié', app('analytics', page('leads', 'a')), 'img/avant/l47-analytics.png', 'Analytics actuel : 6 cartes passives, graphique fixe', 'Clic sur « Leads » : la courbe et le tri du tableau suivent. Plus d’aplat vert ni d’encoche : un trait sous l’onglet, comme partout ailleurs.');
  const short = `<div class="u2-top"><div style="flex:1"><h1>Démos</h1><p>Vos parcours interactifs, prêts à partager.</p></div><button class="fd-btn fd-btn--primary fd-btn--lg" type="button">${I('plus')}Nouvelle démo</button></div>
    <nav class="k-short" aria-label="Indicateurs des 30 derniers jours">${KPI.map((x, i) => `<a class="k-sc${i === 1 ? ' is-h' : ''}" href="#"><span class="l">${x.l === 'Visiteurs' ? 'Visiteurs uniques' : x.l}</span><span class="v">${x.v}</span><span class="d">${x.d}</span><span class="go" aria-hidden="true">Analytics${I('arrow', 14)}</span><span class="sr-only">, voir dans Analytics</span></a>`).join('')}</nav>
    <div style="height:280px;border-radius:20px;background:var(--fd-color-surface);opacity:.5" aria-hidden="true"></div>`;
  document.getElementById('a2').outerHTML = pair('Page Démos : quatre raccourcis identiques', app('demos', short, { h: 640 }), 'img/avant/l47-l48-demos.png', 'Page Démos actuelle : première carte verte, flèche dans un rond', 'Une seule bande, quatre chiffres égaux ; au survol (ici « Visiteurs uniques »), un fond léger et « Analytics → ».');
  document.getElementById('a3').innerHTML = `<table class="k-rule"><thead><tr><th>Période précédente</th><th>Exemple</th><th>Affichage</th></tr></thead><tbody>
    <tr><td>10 ou plus</td><td>4 812 contre 4 296</td><td>+12 %</td></tr><tr><td>10 ou plus, hausse au-delà de +999 %</td><td>1 340 contre 12</td><td>×112</td></tr>
    <tr><td>Entre 1 et 9</td><td>14 contre 3</td><td>+11 vs 3</td></tr><tr><td>0, avec de l’activité maintenant</td><td>27 contre 0</td><td>Nouveau</td></tr><tr><td>0 sur les deux périodes</td><td>0 contre 0</td><td>—</td></tr><tr><td>Taux</td><td>64 % contre 59 %</td><td>+5 pts</td></tr></tbody></table>`;
  document.getElementById('a4').innerHTML = `<div style="flex:1;min-width:960px">${app('analytics', `<section class="k-card">${tabs('completion', 'd')}${panel('completion', 'd', 200)}</section>`, { theme: 'dark', h: 520 })}</div>
    <div class="u2-ph"><h1 style="margin:0;font-size:24px">Analytics</h1><section class="k-card">${tabs('visitors', 'm')}${panel('visitors', 'm', 180)}</section></div>`;
  document.querySelectorAll('[role=tablist]').forEach((tl) => { const ts = [...tl.querySelectorAll('[role=tab]')]; ts.forEach((t, i) => t.addEventListener('keydown', (e) => { const k = { ArrowRight: i + 1, ArrowLeft: i - 1, Home: 0, End: ts.length - 1 }[e.key]; if (k !== undefined) { e.preventDefault(); const n = ts[(k + ts.length) % ts.length]; ts.forEach((x) => { x.setAttribute('aria-selected', x === n); x.tabIndex = x === n ? 0 : -1; }); n.focus(); } })); });
</script>
</body>
</html>
