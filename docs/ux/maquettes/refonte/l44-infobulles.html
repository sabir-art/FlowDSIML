<!doctype html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Infobulles (lot L44) — TutoClick</title>
<link rel="icon" href="../../brand-tutoclic/production/favicon.svg">
<link rel="stylesheet" href="refonte.css">
<link rel="stylesheet" href="ui2.css">
<script src="ui2.js"></script>
<style>
  /* L44, reprise UI (composants §17) : livré et conforme (f62c292). Spec : docs/ux/specs/l44-infobulles.md. */
  .t-shot { border-radius: 16px; overflow: hidden; box-shadow: 0 1px 2px rgb(8 10 14 / .08), 0 8px 32px rgb(8 10 14 / .08); }
  .t-shot img { display: block; width: 520px; }
  .t-tip { position: relative; display: inline-flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 8px; background: #12161B; color: #fff; font: 500 13px var(--fd-font-sans); }
  .t-tip kbd { font: 600 12px var(--fd-font-sans); padding: 1px 6px; border-radius: 4px; background: rgb(255 255 255 / .14); }
  .t-tip::after { content: ''; position: absolute; left: 50%; bottom: -4px; width: 10px; height: 10px; background: inherit; transform: translateX(-50%) rotate(45deg); }
  .t-rules { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; }
  .t-rules .u2-card { display: flex; flex-direction: column; gap: 16px; align-items: flex-start; }
  .t-rules p { margin: 0; font-size: 14px; color: var(--fd-color-text-muted); }
  .t-btn { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 999px; background: var(--fd-color-surface-sunken); }
</style>
</head>
<body>
<main class="u2">
  <header class="u2-head"><div><small>Lot L44 · Reprise UI</small><h1>Infobulles</h1><p>Livré (f62c292) et conforme : bulle sombre, flèche vers l’icône, raccourci en pastille, jamais coupée. 849 boutons à icône vérifiés sur 97 pages, aucun sans nom.</p></div></header>
  <section class="u2-sec"><h2>Rendu livré, en clair et en sombre</h2><div class="u2-row"><div class="t-shot"><img src="img/avant/l44-light.png" alt="Infobulle « Aide, F1 » sous le bouton d’aide, thème clair"></div><div class="t-shot"><img src="img/avant/l44-dark.png" alt="Même infobulle en thème sombre"></div></div></section>
  <section class="u2-sec"><h2>Trois règles visuelles</h2><div class="t-rules" id="r"></div></section>
</main>
<script>
  const { I } = U2;
  document.getElementById('r').innerHTML = [
    [`<span class="t-tip">Annuler <kbd>Ctrl</kbd><kbd>Z</kbd></span>`, '1 à 4 mots, sans point. Le raccourci seulement s’il existe.'],
    [`<span class="t-tip">Plein écran</span>`, 'Une bulle à la fois, 300 ms au survol, immédiate au clavier.'],
    [`<span class="t-btn">${I('help')}</span>`, 'Jamais d’infobulle sur un bouton qui a déjà un texte visible.']
  ].map(([v, t]) => `<div class="u2-card"><div style="height:56px;display:flex;align-items:center">${v}</div><p>${t}</p></div>`).join('');
</script>
</body>
</html>
