<link rel="stylesheet" href="../../../../../packages/ui/src/base.css"><style>/* Lot 1 des maquettes : Paramètres. NAV-02, NAV-03 (PageHeader), COMP-01, FIELD-01, MODAL-01. Données fictives (Acme, example.com). */

/* Lot 8 : lecteur public (FIELD-01, MODAL-01, ICON-01) */

.lg-d { display: none; } [data-theme='dark'] .lg-l { display: none; } [data-theme='dark'] .lg-d { display: inline; }

.ta { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
