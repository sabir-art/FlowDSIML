<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Orbe qui parle</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#f6f7fb;--tx:#1d2433;--mu:#5b6472}
body{margin:0;background:var(--bg);color:var(--tx);font:400 13px/1.4 Inter,system-ui,sans-serif}
.row{display:flex;gap:40px;padding:24px 32px;align-items:flex-start}
.row.dark{--bg:#14161b;--tx:#eef0f4;--mu:#9aa3af;background:var(--bg);color:var(--tx)}
figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:8px;width:120px;text-align:center}
figcaption small{display:block;color:var(--mu)}
canvas{width:72px;height:72px}
</style></head><body>
<div class="row" id="r1"></div><div class="row dark" id="r2"></div>
<script src="orbe.js"></script>
<script>
// Démo : volume simulé de parole (syllabes, respirations) ; dans le lecteur, il vient de l'AnalyserNode.
const speech = (t) => { const syl = Math.abs(Math.sin(t * 8.5)) ** 1.5; const phr = 0.5 + 0.5 * Math.sin(t * 1.25); const gap = (t % 3.2) > 2.7 ? 0 : 1; return Math.min(1, syl * phr * gap * 1.1); };
const items = [
  { cap: 'Parle', sub: 'couleurs du thème', a: '#a3195b', b: '#4b3fe0', st: 'speaking' },
  { cap: 'Parle', sub: 'variante neutre', a: '#5b6b82', b: '#2b3445', st: 'speaking' },
  { cap: 'Au repos', sub: 'respire', a: '#a3195b', b: '#4b3fe0', st: 'idle' },
  { cap: 'En pause', sub: 'figé, grisé', a: '#a3195b', b: '#4b3fe0', st: 'paused' },
  { cap: 'Mouvement réduit', sub: 'anneau pulsé', a: '#a3195b', b: '#4b3fe0', st: 'speaking', reduced: true },
];
const all = [];
for (const id of ['r1', 'r2']) for (const it of items) {
  const f = document.createElement('figure'); const cv = document.createElement('canvas'); const S = 72, d = window.devicePixelRatio || 1;
  cv.width = S * d; cv.height = S * d; cv.setAttribute('role', 'img'); cv.setAttribute('aria-label', it.cap);
  f.appendChild(cv); f.insertAdjacentHTML('beforeend', `<figcaption>${it.cap}<small>${it.sub}</small></figcaption>`);
  document.getElementById(id).appendChild(f); const ctx = cv.getContext('2d'); ctx.scale(d, d); all.push({ ctx, it, S });
}
window.__render = (t) => { for (const { ctx, it, S } of all) TutoOrb.drawOrb(ctx, { size: S, t: it.st === 'paused' ? 1.2 : t, level: it.st === 'speaking' ? speech(t) : 0, a: it.a, b: it.b, state: it.st, reduced: !!it.reduced }); };
if (!location.search.includes('frames')) { const t0 = performance.now(); const loop = () => { __render((performance.now() - t0) / 1000); requestAnimationFrame(loop); }; loop(); } else __render(0);
</script></body></html>
