# gitleaks (MIT) : détection de secrets dans tout l'historique du dépôt (public). Règles par défaut,
# plus nos motifs : secrets de signature des webhooks (tcsec_), clés secrètes Supabase (sb_secret_)
# et clés JWT Supabase (anon / service_role). Les fixtures clairement factices sont autorisées.
title = "FlowDSIML"

[extend]
useDefault = true

[[rules]]
id = "tutoclick-webhook-secret"
description = "Secret de signature d'un webhook TutoClick"
regex = '''tcsec_[A-Za-z0-9_-]{32,}'''
keywords = ["tcsec_"]

[[rules]]
id = "supabase-secret-key"
description = "Clé secrète Supabase"
regex = '''sb_secret_[A-Za-z0-9_-]{16,}'''
keywords = ["sb_secret_"]

[[rules]]
id = "supabase-jwt"
description = "Clé JWT Supabase (anon ou service_role)"
regex = '''eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}'''
keywords = ["eyj"]

[allowlist]
description = "Fixtures factices des tests et des maquettes"
regexes = [
  '''tcsec_(EXEMPLE|exemple|test|fictif|fake)[A-Za-z0-9_-]*''',
  # Clé d'accès de l'API : exemple affiché à l'écran et dans les maquettes (jamais une vraie clé)
  '''^tc_votre_cle$''',
  # Clés des fournisseurs IA dans les tests des adaptateurs et de la Console (jamais une vraie clé)
  '''^sk-(bonne-)?fictive[A-Za-z0-9_-]*$''',
]
