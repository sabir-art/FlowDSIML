name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Lint · types · tests · build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - name: Workflows lisibles (YAML)
        run: pnpm check:workflows
      - name: tokens.css généré depuis tokens.ts (source unique du design system)
        run: node packages/ui/src/tokens.build.mjs --check
      - name: Appels RPC des Edge Functions conformes aux signatures des migrations
        run: pnpm check:rpc
      - name: Aucune barre de couleur à gauche des blocs
        run: node scripts/check-left-bars.mjs
      - name: Pages légales statiques à jour (public/legal depuis legal.fr.json)
        run: node scripts/build-legal.mjs --check
      - name: Scripts d'exploitation (tests)
        run: node --test scripts/*.test.mjs
      - run: pnpm turbo run lint typecheck test build
        # Variables obligatoires au build (aucune valeur par défaut dans le code) : valeurs fictives ici
        env:
          VITE_SUPABASE_URL: https://api.tutoclick.example
          VITE_SUPABASE_ANON_KEY: test
          WXT_SUPABASE_URL: https://api.tutoclick.example
          WXT_SUPABASE_ANON_KEY: test
      - name: Edge Functions (deno check de toutes les fonctions + tests du dispatch des webhooks, de la médiathèque, de html-ingest, de l'Assistance IA, d'access-email, d'invite-email et de notify-email)
        working-directory: supabase/functions
        run: |
          npx -y deno@2.5.6 check --no-lock */index.ts
          npx -y deno@2.5.6 test --no-lock --allow-net=127.0.0.1 webhooks-dispatch/ media/ ai/ access-email/ invite-email/ notify-email/
          npx -y deno@2.5.6 test --no-lock --allow-env html-ingest/ html-recheck/

  secrets:
    name: Secrets (gitleaks, tout l'historique)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks 8.21.2 (binaire officiel, somme de contrôle vérifiée)
        run: |
          V=8.21.2
          F=gitleaks_${V}_linux_x64.tar.gz
          curl -sSfL -o "$F" "https://github.com/gitleaks/gitleaks/releases/download/v${V}/${F}"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_checksums.txt" | grep " ${F}$" | sha256sum -c -
          tar xzf "$F" gitleaks
      - name: Recherche de secrets (sorties masquées)
        run: ./gitleaks git --config .gitleaks.toml --redact --no-banner --verbose .

  database:
    name: Migrations SQL + pgTAP
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Postgres 16 + pgTAP
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-16-pgtap
          sudo systemctl start postgresql.service
      - name: Rejouer les migrations et lancer les tests
        # L'utilisateur postgres ne peut pas lire le dossier du runner : copie dans /tmp.
        run: |
          mkdir -p /tmp/fdrepo && cp -r supabase /tmp/fdrepo/ && chmod -R a+rX /tmp/fdrepo
          sudo -u postgres env PGHOST=/var/run/postgresql PGUSER=postgres bash /tmp/fdrepo/supabase/tests/local/run.sh

  a11y:
    name: Accessibilité (axe-core, WCAG 2.2 AA, RGAA)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Navigateur Chromium (Playwright)
        run: pnpm --filter @flowdsiml/web exec playwright install --with-deps chromium
      - name: App web et lecteur (serveurs de dev, faux Supabase dans les tests)
        env:
          VITE_SUPABASE_ANON_KEY: test
          # Hôtes fictifs : le faux Supabase et l'adresse publique du lecteur sont servis par les tests
          VITE_SUPABASE_URL: https://api.tutoclick.example
          VITE_PLAYER_URL: https://demos.tutoclick.example
          VITE_APP_ORIGIN: http://localhost:5173
          # EXT-CONNECT : identifiant fictif ; les e2e simulent chrome.runtime (aucune extension réelle)
          VITE_EXTENSION_ID: abcdefghijklmnopabcdefghijklmnop
        run: |
          (cd apps/web && nohup pnpm exec vite --port 5173 --strictPort > /tmp/web.log 2>&1 &)
          (cd apps/player && nohup pnpm exec vite --port 5174 --strictPort > /tmp/player.log 2>&1 &)
          for i in $(seq 1 60); do
            curl -sf http://localhost:5173/ >/dev/null && curl -sf http://localhost:5174/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/web.log /tmp/player.log; exit 1
      - name: Audit axe-core (0 violation serious ou critical)
        run: cd apps/web && node e2e/a11y.e2e.cjs --report /tmp/a11y-report.json
      - name: Clavier, focus, animations réduites, zoom 200 %, lecteur annoncé
        run: cd apps/web && node e2e/a11y-clavier.e2e.cjs
      - name: Chevrons des listes déroulantes et menus à 12 px au moins du bord, sur toutes les pages
        if: always()
        run: cd apps/web && node e2e/chevrons.e2e.cjs
      - name: Aucun bouton à l'apparence native (toutes les pages)
        if: always()
        run: cd apps/web && node e2e/boutons-natifs.e2e.cjs
      - name: Aucun défilement horizontal dans les panneaux et les pages (1 440 et 390 px, outils de l'éditeur)
        if: always()
        run: cd apps/web && node e2e/defilement-horizontal.e2e.cjs
      - name: Espacements mesurés §18.6 (toutes les routes, clair et sombre, 1440 et 390 px)
        if: always()
        run: cd apps/web && node e2e/espacements.e2e.cjs
      - name: Paramètres, 24 px entre les blocs (clair et sombre)
        if: always()
        run: cd apps/web && node e2e/parametres-espacement.e2e.cjs
      - name: Barres de liste L40 (40 px, une ligne à 1 440 px, feuille Filtres sous 768 px)
        if: always()
        run: cd apps/web && node e2e/l40-barres.e2e.cjs
      - name: Navigation L48-A (barre latérale, Extension, Paramètres groupés, Utilisation)
        if: always()
        run: cd apps/web && node e2e/l48a-navigation.e2e.cjs
      - name: Colonne Dossiers L48-A (sélection, compteurs, sous-dossiers, glisser-déposer, repli)
        if: always()
        run: cd apps/web && node e2e/l48a-dossiers.e2e.cjs
      - name: Colonne Dossiers pleine hauteur, rail et tiroir (retours client 2 et 7)
        if: always()
        run: cd apps/web && node e2e/colonne-dossiers.e2e.cjs
      - name: Barre latérale repliable en rail (retour client 6)
        if: always()
        run: cd apps/web && node e2e/barre-laterale-rail.e2e.cjs
      - name: Photo de profil (retour client 4)
        if: always()
        run: cd apps/web && node e2e/photo-profil.e2e.cjs
      - name: Boutons des pages d'authentification lisibles (libellé, contraste au repos, au survol, au focus)
        if: always()
        run: cd apps/web && node e2e/boutons-auth.e2e.cjs
      - name: Finalité des champs personnels (RGAA 11.13, autocomplete et name)
        if: always()
        run: cd apps/web && node e2e/autocomplete.e2e.cjs
      - name: FIELD-01 un seul indicateur de focus (champs, boutons, liens), rouge d'erreur
        if: always()
        run: cd apps/web && node e2e/champs-focus.e2e.cjs
      - name: Focus clavier visible sur chaque bouton (WCAG 2.4.7, authentification et Paramètres)
        if: always()
        run: cd apps/web && node e2e/boutons-focus.e2e.cjs
      - name: Menu du compte (groupes, intitulé, thème sans double contour)
        if: always()
        run: cd apps/web && node e2e/menu-compte.e2e.cjs
      - name: États vides L48-B (page Démos neuve, recherche sans résultat)
        if: always()
        run: cd apps/web && node e2e/l48b-vides.e2e.cjs
      - name: Analytics L48-D (onglets, widgets, onglet Démos)
        if: always()
        run: cd apps/web && node e2e/l48d-analytics.e2e.cjs
      - name: Intégrations L48-F (liste, connectées, demande à la DSI, page Webhooks)
        if: always()
        run: cd apps/web && node e2e/l48f-integrations.e2e.cjs
      - name: Types de contenu L48-G (création en deux étapes, Sandbox, filtre Type)
        if: always()
        run: cd apps/web && node e2e/l48g-types.e2e.cjs
      - name: 'Guide optionnel du Sandbox A8 (lecteur : bulle, pause, reprise, fin, 390 px)'
        if: always()
        run: cd apps/web && node e2e/guide-sandbox.e2e.cjs
      - name: 'Guide optionnel du Sandbox A8 (éditeur : liste, bulles sur les éléments, ordre, orphelines)'
        if: always()
        run: cd apps/web && node e2e/guide-sandbox-editeur.e2e.cjs
      - name: Sandbox L48-G (liens sans page)
        if: always()
        run: cd apps/web && node e2e/l48g-liens.e2e.cjs
      - name: L49 P1 réglage « Captures HTML » (radios, domaines, lecture seule, types désactivés, mention)
        if: always()
        run: cd apps/web && node e2e/l49-reglage.e2e.cjs
      - name: Rapport d'analyse de sécurité L49 (Sécurité de la page, statut, détail des compteurs, liste avant publication)
        if: always()
        run: cd apps/web && node e2e/l49-rapport.e2e.cjs
      - name: Liens externes L49 (désactivés par défaut, autorisation https, « Vous quittez la démo », formulaire jamais envoyé)
        if: always()
        run: cd apps/web && node e2e/l49-liens.e2e.cjs
      - name: 'Étiquettes L52 (8 couleurs et contrastes, page Paramètres › Étiquettes, fusion, lecture seule, clavier, « + Étiquette » et sélecteur sur la carte)'
        if: always()
        run: cd apps/web && node e2e/l52-etiquettes.e2e.cjs
      - name: 'Audit L50, écarts transverses (focus des champs, cartes sans aplat)'
        if: always()
        run: cd apps/web && node e2e/l50-transverses.e2e.cjs
      - name: 'Tableau de bord des démos (grille, liste, tris, mobile, modale « Nouvelle démo »)'
        if: always()
        run: cd apps/web && node e2e/dashboard.e2e.cjs
      - name: 'Formation et outils (voix off enchaînée, quiz, SCORM, lecteur sous 640 px)'
        if: always()
        run: cd apps/web && node e2e/formation-outils.e2e.cjs
      - name: 'Test A/B dans l’éditeur (création, résultats, arrêt)'
        if: always()
        run: cd apps/web && node e2e/ab-editor.e2e.cjs
      # Liste courte par risque (partage, export, formation, lecteur, aide) ; le reste : e2e-complet.yml
      - name: 'Partage : règles de l’espace (mot de passe, expiration, exports)'
        if: always()
        run: cd apps/web && node e2e/regles-partage.e2e.cjs
      - name: 'Partage : accès aux dossiers'
        if: always()
        run: cd apps/web && node e2e/acces-dossiers.e2e.cjs
      - name: 'Partage : lien, intégration et options (REV-10)'
        if: always()
        run: cd apps/web && node e2e/partager-rev10.e2e.cjs
      - name: 'Diffuser : SCORM, LMS, intranet, où elle est diffusée'
        if: always()
        run: cd apps/web && node e2e/distribute.e2e.cjs
      - name: 'Exports : PDF, GIF et version accessible'
        if: always()
        run: cd apps/web && node e2e/exports.e2e.cjs
      - name: 'Centre de formation : accueil, filtres, cartes, page d’une formation'
        if: always()
        run: cd apps/web && node e2e/center.e2e.cjs
      - name: 'Parcours de formation dans le lecteur'
        if: always()
        run: cd apps/web && node e2e/parcours.e2e.cjs
      - name: 'Quiz dans le lecteur (questions, correction, résultat)'
        if: always()
        run: cd apps/web && node e2e/quiz-player.e2e.cjs
      - name: 'Lecteur : navigation, clavier, fin de démo'
        if: always()
        run: cd apps/web && node e2e/player-ux.e2e.cjs
      - name: 'Aide intégrée (tiroir, recherche, articles de la page)'
        if: always()
        run: cd apps/web && node e2e/aide.e2e.cjs
      - name: Google Safe Browsing L49 (lien signalé bloqué, vérification indisponible, nouvelle vérification à la publication, lecteur)
        if: always()
        run: cd apps/web && node e2e/l49-safebrowsing.e2e.cjs
      - name: Éditeur de page HTML (sélection souris et clavier, actions, liens, annulation)
        if: always()
        run: cd apps/web && node e2e/html-editor.e2e.cjs
      - name: Plan du Sandbox (liaisons, pages clés, clic non relié)
        if: always()
        run: cd apps/web && node e2e/html-sandbox.e2e.cjs
      - name: Éditeur L48-E (rail d'outils, panneau, flou en modale)
        if: always()
        run: cd apps/web && node e2e/l48e-editeur.e2e.cjs
      - name: Commentaires sous le canevas (retour client 1)
        if: always()
        run: cd apps/web && node e2e/commentaires-dock.e2e.cjs
      - name: "Commentaires de l'éditeur (envoi, modification, résolution, par étape)"
        if: always()
        run: cd apps/web && node e2e/comments.e2e.cjs
      - name: 'Commentaires : ouverture sur le premier non lu'
        if: always()
        run: cd apps/web && node e2e/comments-unread.e2e.cjs
      - name: 'Commentaires : mentions'
        if: always()
        run: cd apps/web && node e2e/mentions.e2e.cjs
      - name: 'Notifications (cloche, lien vers un commentaire)'
        if: always()
        run: cd apps/web && node e2e/notifications.e2e.cjs
      - name: Assistant de démarrage L48-C (5 étapes, reprise, extension détectée, Nouvel espace)
        if: always()
        run: cd apps/web && node e2e/onboarding-import.e2e.cjs
      - name: Infobulles L44 (boutons à icône nommés, sans title ; clavier, Échap, bords du lecteur)
        if: always()
        run: cd apps/web && node e2e/infobulles.e2e.cjs
      - name: Composeur L43 (un cadre, Entrée, mentions, modification, erreur, assistant)
        if: always()
        run: cd apps/web && node e2e/composeur.e2e.cjs
      - name: Changement d'espace (retour sur Démos, toast)
        if: always()
        run: cd apps/web && node e2e/changement-espace.e2e.cjs
      - name: L45 espacements (E1 à E21)
        if: always()
        run: cd apps/web && node e2e/l45-espacements.e2e.cjs
      - name: Variables lisibles L46 (pastilles, catalogue, repli, aperçu, Paramètres)
        if: always()
        run: cd apps/web && node e2e/variables.e2e.cjs
      - name: Indicateurs en onglets L47 (Analytics espace et démo, clavier, adresse)
        if: always()
        run: cd apps/web && node e2e/analytics.e2e.cjs
      - name: Console propriétaire L41 (retours sur l'aide, accès, lecture seule, Nouveautés)
        if: always()
        run: cd apps/web && node e2e/console.e2e.cjs
      - name: Rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-report
          path: /tmp/a11y-report.json
          if-no-files-found: ignore

  # Publication de bout en bout (éditeur, RGPD, publish_demo, copies, lecteur) : cassée sans signal
  # en 5358f08. Prévu pour bloquer le déploiement une fois deploy.yml relié à la CI.
  e2e:
    name: E2E publication (éditeur → lecteur)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Navigateur Chromium (Playwright)
        run: pnpm --filter @flowdsiml/web exec playwright install --with-deps chromium
      - name: App web et lecteur (serveurs de dev, faux Supabase dans les tests)
        env:
          VITE_SUPABASE_ANON_KEY: test
          # Hôtes fictifs : le faux Supabase et l'adresse publique du lecteur sont servis par les tests
          VITE_SUPABASE_URL: https://api.tutoclick.example
          VITE_PLAYER_URL: https://demos.tutoclick.example
          # Origine réelle de l'app servie par vite : le lecteur en aperçu n'accepte que ses messages
          VITE_APP_ORIGIN: http://localhost:5173
          # EXT-CONNECT : identifiant fictif ; les e2e simulent chrome.runtime (aucune extension réelle)
          VITE_EXTENSION_ID: abcdefghijklmnopabcdefghijklmnop
        run: |
          (cd apps/web && nohup pnpm exec vite --port 5173 --strictPort > /tmp/web.log 2>&1 &)
          (cd apps/player && nohup pnpm exec vite --port 5174 --strictPort > /tmp/player.log 2>&1 &)
          for i in $(seq 1 60); do
            curl -sf http://localhost:5173/ >/dev/null && curl -sf http://localhost:5174/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/web.log /tmp/player.log; exit 1
      - name: Publication puis lecture (publish-player)
        run: |
          cd apps/web && node e2e/publish-player.e2e.cjs | tee /tmp/e2e.log
          ! grep -q '^NOT OK' /tmp/e2e.log
      - name: Robustesse du lecteur (réseau coupé ou lent, démo supprimée, vidéo absente, 200 étapes)
        run: |
          cd apps/web && node e2e/player-robustesse.e2e.cjs | tee /tmp/e2e-robustesse.log
          ! grep -q '^NOT OK' /tmp/e2e-robustesse.log
      - name: Accès sur invitation et par domaine e-mail (L39, aucun envoi réel)
        run: |
          cd apps/web && node e2e/acces-email.e2e.cjs | tee /tmp/e2e-acces.log
          ! grep -q '^NOT OK' /tmp/e2e-acces.log
