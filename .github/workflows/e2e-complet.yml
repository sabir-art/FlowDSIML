name: e2e complet

# Tous les tests e2e de apps/web/e2e (ceux de ci.yml et les autres), chaque nuit et à la demande.
# Pas à chaque push : la CI garde une liste courte. Un test qui échoue n'arrête pas les suivants ;
# le workflow échoue à la fin avec la liste des tests en échec et leur code de retour.

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

concurrency:
  group: e2e-complet
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  e2e:
    name: Tous les e2e (faux Supabase, serveurs de dev)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Navigateur Chromium (Playwright)
        run: pnpm --filter @flowdsiml/web exec playwright install --with-deps chromium
      - name: App web et lecteur (serveurs de dev, faux Supabase dans les tests)
        env:
          VITE_SUPABASE_ANON_KEY: test
          # Hôtes fictifs : le faux Supabase et l'adresse publique du lecteur sont servis par les tests
          VITE_SUPABASE_URL: https://api.tutoclick.example
          VITE_PLAYER_URL: https://demos.tutoclick.example
          VITE_APP_ORIGIN: http://localhost:5173
          # EXT-CONNECT : identifiant fictif ; les e2e simulent chrome.runtime (aucune extension réelle)
          VITE_EXTENSION_ID: abcdefghijklmnopabcdefghijklmnop
        run: |
          (cd apps/web && nohup pnpm exec vite --port 5173 --strictPort > /tmp/web.log 2>&1 &)
          (cd apps/player && nohup pnpm exec vite --port 5174 --strictPort > /tmp/player.log 2>&1 &)
          for i in $(seq 1 60); do
            curl -sf http://localhost:5173/ >/dev/null && curl -sf http://localhost:5174/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/web.log /tmp/player.log; exit 1
      - name: Lancer tous les e2e
        run: |
          cd apps/web
          failed=""
          total=0
          for f in e2e/*.e2e.cjs; do
            total=$((total + 1))
            echo "::group::$f"
            rc=0
            timeout 900 node "$f" || rc=$?
            echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then
              echo "::error title=e2e en échec::$f (rc=$rc)"
              failed="$failed $f(rc=$rc)"
            fi
          done
          echo "$total tests lancés"
          if [ -n "$failed" ]; then
            echo "Tests en échec :"
            for x in $failed; do echo "  - $x"; done
            {
              echo "## e2e en échec"
              for x in $failed; do echo "- \`$x\`"; done
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "## Tous les e2e passent ($total)" >> "$GITHUB_STEP_SUMMARY"
